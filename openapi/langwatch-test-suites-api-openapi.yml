                              type:
                                type: string
                                const: source
                              sourceId:
                                type: string
                                enum:
                                - conversation
                                - scenario
                                - trace
                              path:
                                minItems: 1
                                maxItems: 3
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                            required:
                            - type
                            - sourceId
                            - path
                          - type: object
                            properties:
                              type:
                                type: string
                                const: value
                              value:
                                type: string
                                maxLength: 65536
                            required:
                            - type
                            - value
                          description: Where one evaluator input reads its value. A source mapping names conversation (first_user_message, last_agent_message, transcript, messages), scenario (situation, criteria, or fields followed by a field identifier) or trace (contexts, spans, or tool_calls followed by a tool name and input or output). A value mapping is a literal.
                        description: Where each evaluator input reads its value, keyed by input name. Inputs left out are unmapped; a required input left unmapped refuses the run.
                    required:
                    - id
                    - evaluatorId
                    - required
                    - mappings
                    description: One evaluator that runs after every scenario run, with where each of its inputs reads from.
                  description: The evaluators that run after every scenario run. Up to 20. A required evaluator that fails fails the scenario; a score-only evaluator reports and never gates.
              required:
              - name
      summary: Create test suite
      x-summary-source: derived
