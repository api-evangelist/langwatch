components:
  schemas:
    DatasetAppendImport:
      type: object
      properties:
        storedObjectId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      required:
      - storedObjectId
    DatasetAttachment:
      type: object
      properties:
        url:
          type: string
          description: The value to write into the cell, and the address the file is served from.
        name:
          type: string
          description: The file name the reference carries.
        mediaType:
          type: string
          description: The media type the file is stored under.
        sizeBytes:
          type: number
          description: The size of the stored file, in bytes.
      required:
      - url
      - name
      - mediaType
      - sizeBytes
      additionalProperties: false
    DatasetImport:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        storedObjectId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        columnTypes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                - string
                - boolean
                - number
                - date
                - list
                - json
                - spans
                - rag_contexts
                - chat_messages
                - annotations
                - evaluations
                - image
                - file
              sourceHeader:
                type: string
            required:
            - name
            - type
            - sourceHeader
      required:
      - name
      - storedObjectId
    DatasetPostEntries:
      type: object
      properties:
        entries:
          minItems: 1
          maxItems: 4000
          type: array
          items:
            type: object
            propertyNames:
              type: string
            additionalProperties: {}
          example:
          - input: hi
            output: Hello, how can I help you today?
      required:
      - entries
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
