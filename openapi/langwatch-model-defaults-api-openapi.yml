openapi: 3.2.0
info:
  title: LangWatch Model Defaults API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Model Defaults
paths:
  /api/v1/model-defaults:
    get:
      operationId: getApiModelDefaults
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: object
                    properties:
                      projectId:
                        type: string
                      teamId:
                        type:
                        - string
                        - 'null'
                      organizationId:
                        type:
                        - string
                        - 'null'
                      organizationName:
                        type:
                        - string
                        - 'null'
                    required:
                    - projectId
                    - teamId
                    - organizationId
                    - organizationName
                    additionalProperties: false
                  effective:
                    type: object
                    properties:
                      DEFAULT:
                        anyOf:
                        - type: object
                          properties:
                            model:
                              type: string
                            source:
                              type: string
                            scope:
                              type:
                              - string
                              - 'null'
                          required:
                          - model
                          - source
                          - scope
                          additionalProperties: false
                        - type: 'null'
                      FAST:
                        anyOf:
                        - type: object
                          properties:
                            model:
                              type: string
                            source:
                              type: string
                            scope:
                              type:
                              - string
                              - 'null'
                          required:
                          - model
                          - source
                          - scope
                          additionalProperties: false
                        - type: 'null'
                      EMBEDDINGS:
                        anyOf:
                        - type: object
                          properties:
                            model:
                              type: string
                            source:
                              type: string
                            scope:
                              type:
                              - string
                              - 'null'
                          required:
                          - model
                          - source
                          - scope
                          additionalProperties: false
                        - type: 'null'
                    required:
                    - DEFAULT
                    - FAST
                    - EMBEDDINGS
                    additionalProperties: false
                  configs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        config:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type: string
                        scopes:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - ORGANIZATION
                                - TEAM
                                - PROJECT
                              id:
                                type: string
                              name:
                                type: string
                            required:
                            - type
                            - id
                            - name
                            additionalProperties: false
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                      - id
                      - config
                      - scopes
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                required:
                - scope
                - effective
                - configs
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: 'Snapshot of the default-model cascade for this project: effective resolution per role, plus the configs the caller can read.'
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:view
      tags:
      - Model Defaults
      summary: Get api model defaults
      x-summary-source: derived
    post:
      operationId: postApiModelDefaults
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                - id
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Create a default-model config attached to one or more scopes. JSON keys may be roles (DEFAULT, FAST, LANGY, EMBEDDINGS) or registered feature keys; missing keys inherit from a higher scope.
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                scopes:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      scopeType:
                        type: string
                        enum:
                        - ORGANIZATION
                        - TEAM
                        - PROJECT
                      scopeId:
                        type: string
                        minLength: 1
                    required:
                    - scopeType
                    - scopeId
              required:
              - config
              - scopes
      tags:
      - Model Defaults
      summary: Post api model defaults
      x-summary-source: derived
  /api/v1/model-defaults/{id}:
    put:
      operationId: putApiModelDefaultsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
        '204':
          description: Updated
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: 'Update a config''s JSON payload and/or its scope attachments. Sending `scopes: []` deletes the config.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                scopes:
                  type: array
                  items:
                    type: object
                    properties:
                      scopeType:
                        type: string
                        enum:
                        - ORGANIZATION
                        - TEAM
                        - PROJECT
                      scopeId:
                        type: string
                        minLength: 1
                    required:
                    - scopeType
                    - scopeId
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:manage
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      tags:
      - Model Defaults
      summary: Put api model defaults by id
      x-summary-source: derived
    delete:
      operationId: deleteApiModelDefaultsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
        '204':
          description: Deleted
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Delete a default-model config. Scope attachments cascade.
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:manage
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      tags:
      - Model Defaults
      summary: Delete api model defaults by id
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
x-provenance:
  method: harvested
  publisher: LangWatch
  source: https://app.langwatch.ai/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
