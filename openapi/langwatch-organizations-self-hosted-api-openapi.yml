openapi: 3.2.0
info:
  title: LangWatch Organizations (Self-Hosted) API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Organizations (Self-Hosted)
paths:
  /api/v1/organizations:
    post:
      operationId: provisionOrganization
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      name:
                        type: string
                      slug:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    additionalProperties: false
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      name:
                        type: string
                      slug:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    additionalProperties: false
                  adminApiKey:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      token:
                        type: string
                        minLength: 1
                    required:
                    - id
                    - token
                    additionalProperties: false
                required:
                - organization
                - team
                - adminApiKey
                additionalProperties: false
      description: Provision a new organization with its first team and a bootstrap admin service key, self-hosted instance administrators only.
      tags:
      - Organizations (Self-Hosted)
      security:
      - instance_admin_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - instance_admin_api_key
        permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                slug:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                adminApiKeyName:
                  type: string
                  minLength: 1
                  maxLength: 100
              required:
              - name
      summary: Provision organization
      x-summary-source: derived
    get:
      operationId: listOrganizations
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        name:
                          type: string
                        slug:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - name
                      - slug
                      - createdAt
                      additionalProperties: false
                required:
                - organizations
                additionalProperties: false
      description: List every organization this instance hosts, self-hosted instance administrators only.
      tags:
      - Organizations (Self-Hosted)
      security:
      - instance_admin_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - instance_admin_api_key
        permissions: []
      summary: List organizations
      x-summary-source: derived
  /api/v1/organizations/{organizationId}:
    get:
      operationId: getOrganizationById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      name:
                        type: string
                      slug:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                    required:
                    - id
                    - name
                    - slug
                    - createdAt
                    additionalProperties: false
                required:
                - organization
                additionalProperties: false
      description: Read one organization's provisioning summary, self-hosted instance administrators only.
      tags:
      - Organizations (Self-Hosted)
      security:
      - instance_admin_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - instance_admin_api_key
        permissions: []
      parameters:
      - in: path
        name: organizationId
        schema:
          type: string
          minLength: 1
        required: true
      summary: Get organization by id
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
x-provenance:
  method: harvested
  publisher: LangWatch
  source: https://app.langwatch.ai/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
