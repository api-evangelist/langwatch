openapi: 3.2.0
info:
  title: LangWatch Stored Objects API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Stored Objects
paths:
  /api/v1/stored-objects/uploads:
    post:
      operationId: createStoredObjectUpload
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectId:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  uploadUrl:
                    type: string
                    format: uri
                  method:
                    type: string
                    const: PUT
                  headers:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: string
                      minLength: 1
                  expiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                required:
                - objectId
                - uploadUrl
                - method
                - expiresAt
                additionalProperties: false
      summary: Create a stored-object upload
      tags:
      - Stored Objects
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                purpose:
                  type: string
                  minLength: 1
                  maxLength: 127
                filename:
                  type: string
                  minLength: 1
                mediaType:
                  type: string
                  minLength: 1
                  maxLength: 127
                  pattern: ^[\u0020-\u007e]+$
                byteLength:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
              - projectId
              - purpose
              - filename
              - mediaType
              - byteLength
              additionalProperties: false
  /api/v1/stored-objects/uploads/{storedObjectId}/confirmation:
    post:
      operationId: confirmStoredObjectUpload
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  id:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  sha256:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  byteLength:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  filename: {}
                  mediaType:
                    type: string
                    minLength: 1
                    maxLength: 127
                    pattern: ^[\u0020-\u007e]+$
                  audience:
                    type: string
                    enum:
                    - organization:view
                    - project:view
                    - team:view
                    - analytics:view
                    - cost:view
                    - traces:view
                    - scenarios:view
                    - annotations:view
                    - evaluations:view
                    - datasets:view
                    - triggers:view
                    - workflows:view
                    - experiments:view
                    - prompts:view
                    - secrets:view
                    - playground:view
                    - ops:view
                    - auditLog:view
                    - virtualKeys:view
                    - gatewayBudgets:view
                    - gatewayProviders:view
                    - routingPolicies:view
                    - gatewayGuardrails:view
                    - gatewayLogs:view
                    - gatewayUsage:view
                    - gatewayCacheRules:view
                    - governance:view
                    - ingestionSources:view
                    - anomalyRules:view
                    - complianceExport:view
                    - activityMonitor:view
                    - aiTools:view
                    - webhookEndpoints:view
                    - gatewaySpend:view
                    - langy:view
                    - agentCache:view
                    - governanceCost:view
                    - sso:view
                required:
                - projectId
                - id
                - sha256
                - byteLength
                - filename
                - mediaType
                - audience
                additionalProperties: false
      summary: Confirm a stored-object upload
      tags:
      - Stored Objects
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:update
      parameters:
      - in: path
        name: storedObjectId
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
              required:
              - projectId
              additionalProperties: false
  /api/v1/stored-objects/{storedObjectId}:
    get:
      operationId: getStoredObject
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      projectId:
                        type: string
                        minLength: 1
                        maxLength: 255
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                      id:
                        type: string
                        minLength: 1
                        maxLength: 255
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                      sha256:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      byteLength:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      mediaType:
                        type: string
                        minLength: 1
                        maxLength: 127
                        pattern: ^[\u0020-\u007e]+$
                      filename: {}
                      mediaTypeVerified:
                        type: boolean
                      status:
                        type: string
                        enum:
                        - pending
                        - available
                        - deleted
                        - failed
                      audiences:
                        type: array
                        items:
                          type: string
                          enum:
                          - organization:view
                          - project:view
                          - team:view
                          - analytics:view
                          - cost:view
                          - traces:view
                          - scenarios:view
                          - annotations:view
                          - evaluations:view
                          - datasets:view
                          - triggers:view
                          - workflows:view
                          - experiments:view
                          - prompts:view
                          - secrets:view
                          - playground:view
                          - ops:view
                          - auditLog:view
                          - virtualKeys:view
                          - gatewayBudgets:view
                          - gatewayProviders:view
                          - routingPolicies:view
                          - gatewayGuardrails:view
                          - gatewayLogs:view
                          - gatewayUsage:view
                          - gatewayCacheRules:view
                          - governance:view
                          - ingestionSources:view
                          - anomalyRules:view
                          - complianceExport:view
                          - activityMonitor:view
                          - aiTools:view
                          - webhookEndpoints:view
                          - gatewaySpend:view
                          - langy:view
                          - agentCache:view
                          - governanceCost:view
                          - sso:view
                      generation:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      provenance:
                        type: object
                        properties:
                          purpose:
                            type: string
                            minLength: 1
                            maxLength: 127
                          ownerKind:
                            type: string
                            minLength: 1
                            maxLength: 127
                          ownerId:
                            type: string
                            minLength: 1
                            maxLength: 255
                        required:
                        - purpose
                        - ownerKind
                        - ownerId
                        additionalProperties: false
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      availableAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      deletedAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                    required:
                    - projectId
                    - id
                    - sha256
                    - byteLength
                    - mediaType
                    - filename
                    - mediaTypeVerified
                    - status
                    - audiences
                    - generation
                    - provenance
                    - createdAt
                    additionalProperties: false
                  capability:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      expiresAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      methods:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          enum:
                          - GET
                          - HEAD
                      audience:
                        type: string
                        enum:
                        - organization:view
                        - project:view
                        - team:view
                        - analytics:view
                        - cost:view
                        - traces:view
                        - scenarios:view
                        - annotations:view
                        - evaluations:view
                        - datasets:view
                        - triggers:view
                        - workflows:view
                        - experiments:view
                        - prompts:view
                        - secrets:view
                        - playground:view
                        - ops:view
                        - auditLog:view
                        - virtualKeys:view
                        - gatewayBudgets:view
                        - gatewayProviders:view
                        - routingPolicies:view
                        - gatewayGuardrails:view
                        - gatewayLogs:view
                        - gatewayUsage:view
                        - gatewayCacheRules:view
                        - governance:view
                        - ingestionSources:view
                        - anomalyRules:view
                        - complianceExport:view
                        - activityMonitor:view
                        - aiTools:view
                        - webhookEndpoints:view
                        - gatewaySpend:view
                        - langy:view
                        - agentCache:view
                        - governanceCost:view
                        - sso:view
                      generation:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                    - url
                    - expiresAt
                    - methods
                    - audience
                    - generation
                    additionalProperties: false
                required:
                - metadata
                - capability
                additionalProperties: false
      summary: Resolve a fresh stored-object capability
      tags:
      - Stored Objects
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:view
      parameters:
      - in: path
        name: storedObjectId
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        required: true
      - in: query
        name: projectId
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        required: true
      - in: query
        name: audience
        schema:
          type: string
          enum:
          - organization:view
          - project:view
          - team:view
          - analytics:view
          - cost:view
          - traces:view
          - scenarios:view
          - annotations:view
          - evaluations:view
          - datasets:view
          - triggers:view
          - workflows:view
          - experiments:view
          - prompts:view
          - secrets:view
          - playground:view
          - ops:view
          - auditLog:view
          - virtualKeys:view
          - gatewayBudgets:view
          - gatewayProviders:view
          - routingPolicies:view
          - gatewayGuardrails:view
          - gatewayLogs:view
          - gatewayUsage:view
          - gatewayCacheRules:view
          - governance:view
          - ingestionSources:view
          - anomalyRules:view
          - complianceExport:view
          - activityMonitor:view
          - aiTools:view
          - webhookEndpoints:view
          - gatewaySpend:view
          - langy:view
          - agentCache:view
          - governanceCost:view
          - sso:view
        required: true
    delete:
      operationId: deleteStoredObject
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  generation:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  deletedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                required:
                - id
                - generation
                - deletedAt
                additionalProperties: false
      summary: Delete a stored object
      tags:
      - Stored Objects
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:manage
      parameters:
      - in: path
        name: storedObjectId
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
              - projectId
              - idempotencyKey
              additionalProperties: false
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
