                          - MISSING_TIME_BUCKETS
                          - INCOMPLETE_COMPARISON_PERIOD
                          - APP_FUNCTION_VALUE_TRUNCATED
                          - APP_FUNCTION_UNRESOLVED_KEYS
                          - APP_FUNCTION_RESULT_TRUNCATED
                          - INSTANT_EVAL_SKIPPED
                        message:
                          type: string
                        meta:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                      required:
                      - code
                      - message
                      additionalProperties: false
                  followsTimeWindow:
                    type: boolean
                  followsGranularity:
                    type: boolean
                  granularitySeconds:
                    type: number
                  coarsenedFromSeconds:
                    type: number
                  completeness:
                    type: object
                    properties:
                      state:
                        type: string
                        enum:
                        - complete
                        - partial
                        - missing
                        - no_traffic
                      unit:
                        type: string
                      total:
                        type: number
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            label:
                              type: string
                            present:
                              type: number
                          required:
