      description: 'Mints a new virtual key and returns the secret exactly once. With `reveal_once` the response withholds the secret and carries `reveal_id` and `preview` instead: the secret is parked for 24 hours and served once, to the person the key is for, through the LangWatch app. scopes defaults to the project the caller names; an API key that names no project must send scopes. Org- and team-scoped keys require virtualKeys:manage at each requested scope.'
      summary: Create virtual key
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'A caller-chosen key, 8 to 255 characters, that makes this create safe to retry. The first request to use a key runs normally and its response is stored for 24 hours. A later request with the same key and the same body is not executed again: it returns the stored response, marked with `X-Idempotent-Replay: true`. The same key with a different body is refused 409 `idempotency_error`, as is a retry sent while the original is still running. Only successful responses are stored, so a create that failed can simply be retried with the same key.'
        schema:
          type: string
          minLength: 8
          maxLength: 255
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - virtualKeys:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                description:
                  type: string
                principal_user_id:
                  type:
                  - string
                  - 'null'
                reveal_once:
                  type: boolean
                scopes:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      scope_type:
                        type: string
                        enum:
                        - organization
                        - team
                        - project
                      scope_id:
                        type: string
                        minLength: 1
                    required:
                    - scope_type
                    - scope_id
                trace_project_id:
                  type:
                  - string
                  - 'null'
                routing_policy_id:
                  type:
                  - string
                  - 'null'
                routing_mode:
                  type: string
                  enum:
                  - none
                  - fallback_all
                  - policy
                expires_at:
                  type: string
                  format: date-time
                budget:
                  anyOf:
                  - type: object
                    properties:
                      limit_usd:
                        anyOf:
                        - type: number
                          exclusiveMinimum: 0
                        - type: string
                          pattern: ^\d+(\.\d+)?$
                      window:
                        type: string
                        enum:
                        - day
                        - week
                        - month
                      on_breach:
                        type: string
                        enum:
                        - block
                        - warn
                      name:
                        type: string
                        minLength: 1
                        maxLength: 128
                    required:
                    - limit_usd
                    - window
                  - type: 'null'
                config:
                  type: object
                  properties:
                    modelsAllowed:
