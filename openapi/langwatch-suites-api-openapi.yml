                        additionalProperties:
                          oneOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                const: source
                              sourceId:
                                type: string
                                minLength: 1
                              path:
                                type: array
                                items:
                                  type: string
                            required:
                            - type
                            - sourceId
                            - path
                            additionalProperties: false
                          - type: object
                            properties:
                              type:
                                type: string
                                const: value
                              value:
                                type: string
                            required:
                            - type
                            - value
                            additionalProperties: false
                      runParameters:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          anyOf:
                          - type: string
                            maxLength: 4096
                          - type: number
                          - type: boolean
                      runSecretParameterNames:
                        maxItems: 50
                        type: array
                        items:
                          type: string
                          maxLength: 64
                    required:
                    - type
                    - referenceId
                    additionalProperties: false
                repeatCount:
                  default: 1
                  type: integer
                  minimum: 1
                  maximum: 100
                labels:
                  default: []
                  type: array
                  items:
                    type: string
              required:
              - name
              additionalProperties: false
      tags:
      - Suites
      summary: Post api suites
      x-summary-source: derived
