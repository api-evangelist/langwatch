                        type: number
                      rowsRead:
                        type: number
                      bytesRead:
                        type: number
                      rowsReturned:
                        type: number
                    required:
                    - elapsedMs
                    - rowsRead
                    - bytesRead
                    - rowsReturned
                    additionalProperties: false
                  diagnostics:
                    readOnly: true
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
