  /api/gateway/v1/end-users/{id}/spend:
    get:
      operationId: getApiGatewayV1EndUsersByIdSpend
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      end_user_id:
                        type: string
                      window:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      cost:
                        type: object
                        properties:
                          total_usd:
                            type: string
                            description: Display value. Decimal string, up to 9 fractional digits, trailing zeros trimmed, never exponent notation. Use nano_usd for arithmetic.
                          nano_usd:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                            description: Canonical integer cost, nano-USD. Rated as an integer and summed as one, so this is the figure to reconcile against.
                        required:
                        - total_usd
                        - nano_usd
                        additionalProperties: false
                      request_count:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      usage:
                        type: object
                        properties:
                          input_tokens:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          output_tokens:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
