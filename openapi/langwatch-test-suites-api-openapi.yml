openapi: 3.2.0
info:
  title: LangWatch Test Suites API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Test Suites
paths:
  /api/v1/test-suites:
    get:
      operationId: listTestSuites
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The test suite id.
                    name:
                      type: string
                      description: The test suite name.
                    slug:
                      type: string
                      description: The suite's address in the platform. It is kept when the suite is renamed.
                    scenarioIds:
                      type: array
                      items:
                        type: string
                      description: The scenarios filed in this suite, in the order it shows them.
                    scenarioCount:
                      type: number
                      description: How many scenarios are filed in it.
                    fields:
                      description: The fields the test suite declares. Absent on servers that predate fields on this family.
                      maxItems: 30
                      type: array
                      items:
                        type: object
                        properties:
                          identifier:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^[a-z][a-z0-9_]*$
                            description: The field name, as scenarios and evaluator mappings address it. Lowercase letters, digits and underscores, starting with a letter.
                          type:
                            type: string
                            enum:
                            - text
                            - number
                            - boolean
                            description: The value type every scenario carries for this field.
                        required:
                        - identifier
                        - type
                        additionalProperties: false
                        description: One field the test suite declares beyond situation and criteria. Every scenario filed in the suite carries a value for it.
                    evaluators:
                      description: The evaluators attached to the test suite. Absent on servers that predate evaluators on this family.
                      maxItems: 20
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 64
                            description: The attachment id. Stable across edits of the attachment.
                          evaluatorId:
                            type: string
                            minLength: 1
                            description: The id of the saved evaluator this attachment runs.
                          required:
                            type: boolean
                            description: Whether a failing result fails the scenario. A score-only evaluator reports and never gates.
                          mappings:
                            type: object
                            propertyNames:
                              type: string
                              minLength: 1
                              maxLength: 128
                            additionalProperties:
                              oneOf:
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    const: source
                                  sourceId:
                                    type: string
                                    enum:
                                    - conversation
                                    - scenario
                                    - trace
                                  path:
                                    minItems: 1
                                    maxItems: 3
                                    type: array
                                    items:
                                      type: string
                                      minLength: 1
                                      maxLength: 256
                                required:
                                - type
                                - sourceId
                                - path
                                additionalProperties: false
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    const: value
                                  value:
                                    type: string
                                    maxLength: 65536
                                required:
                                - type
                                - value
                                additionalProperties: false
                              description: Where one evaluator input reads its value. A source mapping names conversation (first_user_message, last_agent_message, transcript, messages), scenario (situation, criteria, or fields followed by a field identifier) or trace (contexts, spans, or tool_calls followed by a tool name and input or output). A value mapping is a literal.
                            description: Where each evaluator input reads its value, keyed by input name. Inputs left out are unmapped; a required input left unmapped refuses the run.
                        required:
                        - id
                        - evaluatorId
                        - required
                        - mappings
                        additionalProperties: false
                        description: One evaluator that runs after every scenario run, with where each of its inputs reads from.
                    archivedAt:
                      description: When the suite was archived, or null while it is active.
                      type:
                      - string
                      - 'null'
                    createdAt:
                      type: string
                      description: When the suite was created.
                    updatedAt:
                      type: string
                      description: When the suite was last written.
                    platformUrl:
                      type: string
                      format: uri
                      description: Where to open this test suite in the LangWatch platform.
                  required:
                  - id
                  - name
                  - slug
                  - scenarioIds
                  - scenarioCount
                  - archivedAt
                  - createdAt
                  - updatedAt
                  - platformUrl
                  additionalProperties: false
      description: List the project's test suites. Archived suites are left out unless includeArchived is set. Run plans are not test suites and are listed by the run plans family.
      tags:
      - Test Suites
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:view
      parameters:
      - in: query
        name: includeArchived
        schema:
          default: 'false'
          type: string
        description: Include archived test suites in the list. true, 1, yes for yes; false, 0, no or omitted for no.
      summary: List test suites
      x-summary-source: derived
    post:
      operationId: createTestSuite
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The test suite id.
                  name:
                    type: string
                    description: The test suite name.
                  slug:
                    type: string
                    description: The suite's address in the platform. It is kept when the suite is renamed.
                  scenarioIds:
                    type: array
                    items:
                      type: string
                    description: The scenarios filed in this suite, in the order it shows them.
                  scenarioCount:
                    type: number
                    description: How many scenarios are filed in it.
                  fields:
                    description: The fields the test suite declares. Absent on servers that predate fields on this family.
                    maxItems: 30
                    type: array
                    items:
                      type: object
                      properties:
                        identifier:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^[a-z][a-z0-9_]*$
                          description: The field name, as scenarios and evaluator mappings address it. Lowercase letters, digits and underscores, starting with a letter.
                        type:
                          type: string
                          enum:
                          - text
                          - number
                          - boolean
                          description: The value type every scenario carries for this field.
                      required:
                      - identifier
                      - type
                      additionalProperties: false
                      description: One field the test suite declares beyond situation and criteria. Every scenario filed in the suite carries a value for it.
                  evaluators:
                    description: The evaluators attached to the test suite. Absent on servers that predate evaluators on this family.
                    maxItems: 20
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 64
                          description: The attachment id. Stable across edits of the attachment.
                        evaluatorId:
                          type: string
                          minLength: 1
                          description: The id of the saved evaluator this attachment runs.
                        required:
                          type: boolean
                          description: Whether a failing result fails the scenario. A score-only evaluator reports and never gates.
                        mappings:
                          type: object
                          propertyNames:
                            type: string
                            minLength: 1
                            maxLength: 128
                          additionalProperties:
                            oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  const: source
                                sourceId:
                                  type: string
                                  enum:
                                  - conversation
                                  - scenario
                                  - trace
                                path:
                                  minItems: 1
                                  maxItems: 3
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                    maxLength: 256
                              required:
                              - type
                              - sourceId
                              - path
                              additionalProperties: false
                            - type: object
                              properties:
                                type:
                                  type: string
                                  const: value
                                value:
                                  type: string
                                  maxLength: 65536
                              required:
                              - type
                              - value
                              additionalProperties: false
                            description: Where one evaluator input reads its value. A source mapping names conversation (first_user_message, last_agent_message, transcript, messages), scenario (situation, criteria, or fields followed by a field identifier) or trace (contexts, spans, or tool_calls followed by a tool name and input or output). A value mapping is a literal.
                          description: Where each evaluator input reads its value, keyed by input name. Inputs left out are unmapped; a required input left unmapped refuses the run.
                      required:
                      - id
                      - evaluatorId
                      - required
                      - mappings
                      additionalProperties: false
                      description: One evaluator that runs after every scenario run, with where each of its inputs reads from.
                  archivedAt:
                    description: When the suite was archived, or null while it is active.
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    description: When the suite was created.
                  updatedAt:
                    type: string
                    description: When the suite was last written.
                  platformUrl:
                    type: string
                    format: uri
                    description: Where to open this test suite in the LangWatch platform.
                required:
                - id
                - name
                - slug
                - scenarioIds
                - scenarioCount
                - archivedAt
                - createdAt
                - updatedAt
                - platformUrl
                additionalProperties: false
      description: 'Create a test suite. It starts empty: scenarios join it by being filed into it, and the targets a run goes against are sent with the run. It may declare fields and attach evaluators from the start.'
      tags:
      - Test Suites
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The test suite name, as it reads in the platform.
                fields:
                  maxItems: 30
                  type: array
                  items:
                    type: object
                    properties:
                      identifier:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^[a-z][a-z0-9_]*$
                        description: The field name, as scenarios and evaluator mappings address it. Lowercase letters, digits and underscores, starting with a letter.
                      type:
                        type: string
                        enum:
                        - text
                        - number
                        - boolean
                        description: The value type every scenario carries for this field.
                    required:
                    - identifier
                    - type
                    description: One field the test suite declares beyond situation and criteria. Every scenario filed in the suite carries a value for it.
                  description: The fields the test suite declares, in the order the platform shows them. Up to 30. An identifier is lowercase letters, digits and underscores, starting with a letter; the type is text, number or boolean.
                evaluators:
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 64
                        description: The attachment id. Stable across edits of the attachment.
                      evaluatorId:
                        type: string
                        minLength: 1
                        description: The id of the saved evaluator this attachment runs.
                      required:
                        type: boolean
                        description: Whether a failing result fails the scenario. A score-only evaluator reports and never gates.
                      mappings:
                        type: object
                        propertyNames:
                          type: string
                          minLength: 1
                          maxLength: 128
                        additionalProperties:
