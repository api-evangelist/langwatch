openapi: 3.2.0
info:
  title: LangWatch Dataset API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Dataset
paths:
  /api/v1/dataset:
    get:
      operationId: getApiDataset
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        columnTypes:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              type:
                                type: string
                                enum:
                                - string
                                - boolean
                                - number
                                - date
                                - list
                                - json
                                - spans
                                - rag_contexts
                                - chat_messages
                                - annotations
                                - evaluations
                                - image
                                - file
                            required:
                            - name
                            - type
                            additionalProperties: false
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        platformUrl:
                          type: string
                        recordCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                      - id
                      - name
                      - slug
                      - columnTypes
                      - createdAt
                      - updatedAt
                      - platformUrl
                      - recordCount
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      limit:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      total:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      totalPages:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                    - page
                    - limit
                    - total
                    - totalPages
                    additionalProperties: false
                required:
                - data
                - pagination
                additionalProperties: false
      description: List all non-archived datasets for the project (paginated)
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:view
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      - in: query
        name: limit
        schema:
          default: 50
          type: integer
          exclusiveMinimum: 0
          maximum: 1000
      tags:
      - Dataset
      summary: Get api dataset
      x-summary-source: derived
    post:
      operationId: postApiDataset
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  columnTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        type:
                          type: string
                          enum:
                          - string
                          - boolean
                          - number
                          - date
                          - list
                          - json
                          - spans
                          - rag_contexts
                          - chat_messages
                          - annotations
                          - evaluations
                          - image
                          - file
                      required:
                      - name
                      - type
                      additionalProperties: false
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  platformUrl:
                    type: string
                required:
                - id
                - name
                - slug
                - columnTypes
                - createdAt
                - updatedAt
                - platformUrl
                additionalProperties: false
      description: Create a new dataset
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                columnTypes:
                  default: []
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                        - string
                        - boolean
                        - number
                        - date
                        - list
                        - json
                        - spans
                        - rag_contexts
                        - chat_messages
                        - annotations
                        - evaluations
                        - image
                        - file
                    required:
                    - name
                    - type
              required:
              - name
      tags:
      - Dataset
      summary: Post api dataset
      x-summary-source: derived
  /api/v1/dataset/{slugOrId}/records:
    post:
      operationId: postApiDatasetBySlugOrIdRecords
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        datasetId:
                          type: string
                          minLength: 1
                        projectId:
                          type: string
                          minLength: 1
                        entry:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - datasetId
                      - projectId
                      - entry
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                required:
                - data
                additionalProperties: false
      description: Create records in a dataset in batch
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:update
      parameters:
      - in: path
        name: slugOrId
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  minItems: 1
                  maxItems: 4000
                  type: array
                  items:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
              required:
              - entries
      tags:
      - Dataset
      summary: Post api dataset by slug or id records
      x-summary-source: derived
    get:
      operationId: getApiDatasetBySlugOrIdRecords
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        datasetId:
                          type: string
                          minLength: 1
                        projectId:
                          type: string
                          minLength: 1
                        entry:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - datasetId
                      - projectId
                      - entry
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      limit:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      total:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      totalPages:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                    - page
                    - limit
                    - total
                    - totalPages
                    additionalProperties: false
                  dataset:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      slug:
                        type: string
                      columnTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              minLength: 1
                            type:
                              type: string
                              enum:
                              - string
                              - boolean
                              - number
                              - date
                              - list
                              - json
                              - spans
                              - rag_contexts
                              - chat_messages
                              - annotations
                              - evaluations
                              - image
                              - file
                          required:
                          - name
                          - type
                          additionalProperties: false
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      platformUrl:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    - columnTypes
                    - createdAt
                    - updatedAt
                    - platformUrl
                    additionalProperties: false
                required:
                - data
                - pagination
                additionalProperties: false
      description: 'List records for a dataset (paginated). Each page also carries the dataset itself. A page too large for one response is refused with `dataset_page_too_large`: ask again with the smaller `limit` the error names.'
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:view
      parameters:
      - in: path
        name: slugOrId
        schema:
          type: string
        required: true
      - in: query
        name: page
        schema:
          default: 1
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      - in: query
        name: limit
        schema:
          default: 50
          type: integer
          exclusiveMinimum: 0
          maximum: 1000
      tags:
      - Dataset
      summary: Get api dataset by slug or id records
      x-summary-source: derived
    delete:
      operationId: deleteApiDatasetBySlugOrIdRecords
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - deletedCount
                additionalProperties: false
      description: Delete records from a dataset by IDs
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:manage
      parameters:
      - in: path
        name: slugOrId
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recordIds:
                  minItems: 1
                  maxItems: 4000
                  type: array
                  items:
                    type: string
              required:
              - recordIds
      tags:
      - Dataset
      summary: Delete api dataset by slug or id records
      x-summary-source: derived
  /api/v1/dataset/{datasetSlug}/entries:
    post:
      operationId: postApiDatasetBySlugEntries
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                required:
                - success
                additionalProperties: false
      description: Add entries to a dataset
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:update
      parameters:
      - in: path
        name: datasetSlug
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetPostEntries'
      tags:
      - Dataset
      summary: Post api dataset by slug entries
      x-summary-source: derived
    get:
      operationId: getApiDatasetBySlugEntries
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        datasetId:
                          type: string
                          minLength: 1
                        projectId:
                          type: string
                          minLength: 1
                        entry:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - datasetId
                      - projectId
                      - entry
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      limit:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      total:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      totalPages:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                    - page
                    - limit
                    - total
                    - totalPages
                    additionalProperties: false
                  dataset:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      slug:
                        type: string
                      columnTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              minLength: 1
                            type:
                              type: string
                              enum:
                              - string
                              - boolean
                              - number
                              - date
                              - list
                              - json
                              - spans
                              - rag_contexts
                              - chat_messages
                              - annotations
                              - evaluations
                              - image
                              - file
                          required:
                          - name
                          - type
                          additionalProperties: false
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      platformUrl:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    - columnTypes
                    - createdAt
                    - updatedAt
                    - platformUrl
                    additionalProperties: false
                required:
                - data
                - pagination
                additionalProperties: false
      description: List entries of a dataset (paginated). Same as GET /:slugOrId/records.
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:view
      parameters:
      - in: path
        name: datasetSlug
        schema:
          type: string
        required: true
      - in: query
        name: page
        schema:
          default: 1
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      - in: query
        name: limit
        schema:
          default: 50
          type: integer
          exclusiveMinimum: 0
          maximum: 1000
      tags:
      - Dataset
      summary: Get api dataset by slug entries
      x-summary-source: derived
  /api/v1/dataset/imports:
    post:
      operationId: postApiDatasetImports
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: string
                  slug:
                    type: string
                  status:
                    type: string
                    const: processing
                required:
                - datasetId
                - slug
                - status
                additionalProperties: false
      description: Create a dataset from an uploaded and confirmed file
      summary: Create a dataset from an uploaded file
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetImport'
      tags:
      - Dataset
  /api/v1/dataset/{slugOrId}/imports:
    post:
      operationId: postApiDatasetBySlugOrIdImports
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: string
                  recordsCreated:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - datasetId
                - recordsCreated
                additionalProperties: false
      description: Add an uploaded and confirmed file's rows to a dataset
      summary: Import an uploaded file into a dataset
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:update
      parameters:
      - in: path
        name: slugOrId
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetAppendImport'
      tags:
      - Dataset
  /api/v1/dataset/upload:
    post:
      operationId: postApiDatasetUpload
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  columnTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        type:
                          type: string
                          enum:
                          - string
                          - boolean
                          - number
                          - date
                          - list
                          - json
                          - spans
                          - rag_contexts
                          - chat_messages
                          - annotations
                          - evaluations
                          - image
                          - file
                      required:
                      - name
                      - type
                      additionalProperties: false
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  recordsCreated:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - id
                - name
                - slug
                - columnTypes
                - createdAt
                - updatedAt
                - recordsCreated
                additionalProperties: false
      description: Create a new dataset from an uploaded file (CSV, JSON, JSONL) upload the file as a stored object with the purpose dataset_import, then create the dataset from it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                file:
                  type: string
                  format: binary
              required:
              - name
              - file
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:create
      deprecated: true
      tags:
      - Dataset
      summary: Post api dataset upload
      x-summary-source: derived
  /api/v1/dataset/{slugOrId}/upload:
    post:
      operationId: postApiDatasetBySlugOrIdUpload
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: string
                  recordsCreated:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - datasetId
                - recordsCreated
                additionalProperties: false
      description: Upload a file (CSV, JSON, JSONL) to an existing dataset upload the file as a stored object with the purpose dataset_import, then create the dataset from it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:update
      deprecated: true
      parameters:
      - in: path
        name: slugOrId
        schema:
          type: string
        required: true
      tags:
      - Dataset
      summary: Post api dataset by slug or id upload
      x-summary-source: derived
  /api/v1/dataset/attachments:
    post:
      operationId: postApiDatasetAttachments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAttachment'
        '413':
          description: The file is larger than the upload limit.
          content: {}
        '415':
          description: The media type is not accepted.
          content: {}
        '429':
          description: Too many uploads for this project in one minute.
          content: {}
      description: Upload a file for an image or file column and get the reference a cell holds. The project is named by the `projectId` query parameter; the file goes in the `file` multipart field, with an optional `datasetId` field. create the upload, send the file to the address it answers, confirm it as a stored object, then put its reference in the cell
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                datasetId:
                  description: The dataset that owns the file. Omit it while the dataset is still a draft.
                  type: string
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:manage
      deprecated: true
      parameters:
      - in: query
        name: projectId
        schema:
          type: string
          minLength: 1
        required: true
        description: The project the file is stored for.
      tags:
      - Dataset
      summary: Post api dataset attachments
      x-summary-source: derived
  /api/v1/dataset/attachments/uploads:
    post:
      operationId: postApiDatasetAttachmentsUploads
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectId:
                    type: string
                    minLength: 1
                  uploadUrl:
                    type: string
                    format: uri
                  method:
                    type: string
                    const: PUT
                  headers:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: string
                      minLength: 1
                  expiresAt:
                    type: string
                    minLength: 1
                required:
                - objectId
                - uploadUrl
                - method
                - expiresAt
                additionalProperties: false
        '413':
          description: The file is larger than the organization's limit.
          content: {}
        '415':
          description: The media type is not accepted.
          content: {}
        '429':
          description: Too many uploads for this project in one minute.
          content: {}
      description: Answers the address to PUT the file to. After the PUT, confirm the upload at `POST /api/v1/stored-objects/uploads/{objectId}/confirmation`, then write `/api/files/{projectId}/{objectId}/{filename}` into the cell.
      summary: Create an upload for an image or file cell
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - datasets:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  description: The file name the reference will carry.
                  type: string
                  minLength: 1
                mediaType:
                  type: string
                  minLength: 1
                  maxLength: 127
                  pattern: ^[\u0020-\u007e]+$
                  description: The media type of the file.
                byteLength:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: The size of the file, in bytes.
              required:
              - filename
              - mediaType
              - byteLength
      tags:
      - Dataset
  /api/v1/dataset/{slugOrId}:
    get:
      operationId: getApiDatasetBySlugOrId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  columnTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        type:
                          type: string
                          enum:
                          - string
                          - boolean
                          - number
                          - date
                          - list
                          - json
                          - spans
                          - rag_contexts
                          - chat_messages
                          - annotations
                          - evaluations
                          - image
                          - file
                      required:
                      - name
                      - type
                      additionalProperties: false
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  platformUrl:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
