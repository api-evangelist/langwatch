                              anyOf:
                              - type: object
                                properties:
                                  class:
                                    type: string
                                  http_status:
                                    anyOf:
                                    - type: integer
                                      minimum: -9007199254740991
                                      maximum: 9007199254740991
                                    - type: 'null'
                                required:
                                - class
                                - http_status
                                additionalProperties: false
                              - type: 'null'
                            duration_ms:
                              anyOf:
                              - type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              - type: 'null'
                            labels:
                              type: array
                              items:
                                type: string
                            metadata:
                              type: object
                              propertyNames:
                                type: string
                              additionalProperties: {}
                          required:
                          - event_id
                          - event_type
                          - gateway_request_id
                          - occurred_at
                          - usage
                          - cost
                          - status
                          - needs_reconciliation
                          - settle_reason
                          - error
                          - duration_ms
                          - labels
                          - metadata
                          additionalProperties: {}
                      required:
                      - id
                      - type
                      - created
                      - schema_version
                      - data
                      additionalProperties: false
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
