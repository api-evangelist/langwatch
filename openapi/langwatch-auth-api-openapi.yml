                            type: boolean
                          allowOtelDirect:
                            type: boolean
                        required:
                        - allowVk
                        - allowOtelDirect
                        additionalProperties: false
                      code:
                        type: object
                        properties:
                          allowVk:
                            type: boolean
                          allowOtelDirect:
                            type: boolean
                        required:
                        - allowVk
                        - allowOtelDirect
                        additionalProperties: false
                    required:
                    - claude
                    - codex
                    - gemini
                    - opencode
                    - cursor
                    - copilot
                    - code
                    additionalProperties: false
                required:
                - tools
                - providers
                - gatewayProviders
                - budget
                - gatewayUrl
                - adminEmail
                - toolPolicies
                additionalProperties: false
        '400':
          description: Bad Request
