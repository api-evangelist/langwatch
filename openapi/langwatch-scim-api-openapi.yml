openapi: 3.2.0
info:
  title: LangWatch SCIM API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: SCIM
paths:
  /api/scim/v2/ServiceProviderConfig:
    get:
      operationId: scimGetServiceProviderConfig
      responses:
        '200':
          description: The supported capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
                  documentationUri:
                    type: string
                  patch:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    additionalProperties: false
                  bulk:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      maxOperations:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      maxPayloadSize:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                    - supported
                    - maxOperations
                    - maxPayloadSize
                    additionalProperties: false
                  filter:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      maxResults:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                    - supported
                    - maxResults
                    additionalProperties: false
                  changePassword:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    additionalProperties: false
                  sort:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    additionalProperties: false
                  etag:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    additionalProperties: false
                  authenticationSchemes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                      required:
                      - type
                      - name
                      - description
                      additionalProperties: false
                required:
                - schemas
                - documentationUri
                - patch
                - bulk
                - filter
                - changePassword
                - sort
                - etag
                - authenticationSchemes
                additionalProperties: false
      description: 'What this SCIM implementation supports (RFC 7643 section 5), which is how an identity provider decides what it may call: PATCH and filtering are supported, bulk operations, sorting, ETags and password change are not. Unauthenticated, because a provider reads it while being configured, before a token exists.'
      summary: Get the SCIM service provider configuration
      tags:
      - SCIM
      security: []
      x-access-policy:
        kind: public
        credential:
        - none
  /api/scim/v2/ResourceTypes:
    get:
      operationId: scimListResourceTypes
      responses:
        '200':
          description: The User and Group resource types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:ListResponse
                  totalResults:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  startIndex:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  itemsPerPage:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  Resources:
                    type: array
                    items:
                      type: object
                      properties:
                        schemas:
                          type: array
                          items:
                            type: string
                            const: urn:ietf:params:scim:schemas:core:2.0:ResourceType
                        id:
                          type: string
                        name:
                          type: string
                        endpoint:
                          type: string
                        schema:
                          type: string
                        meta:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              const: ResourceType
                            location:
                              type: string
                          required:
                          - resourceType
                          - location
                          additionalProperties: false
                      required:
                      - schemas
                      - id
                      - name
                      - endpoint
                      - schema
                      - meta
                      additionalProperties: false
                required:
                - schemas
                - totalResults
                - startIndex
                - itemsPerPage
                - Resources
                additionalProperties: false
      description: The resources this service provisions, User and Group, each naming the endpoint and the schema URN that serves it (RFC 7643 section 6). Unauthenticated, like the rest of SCIM discovery.
      summary: List the SCIM resource types
      tags:
      - SCIM
      security: []
      x-access-policy:
        kind: public
        credential:
        - none
  /api/scim/v2/Schemas:
    get:
      operationId: scimListSchemas
      responses:
        '200':
          description: The User and Group schema definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:ListResponse
                  totalResults:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  startIndex:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  itemsPerPage:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  Resources:
                    type: array
                    items:
                      type: object
                      properties:
                        schemas:
                          type: array
                          items:
                            type: string
                            const: urn:ietf:params:scim:schemas:core:2.0:Schema
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              type:
                                type: string
                              multiValued:
                                type: boolean
                              required:
                                type: boolean
                              mutability:
                                type: string
                              returned:
                                type: string
                              caseExact:
                                type: boolean
                              uniqueness:
                                type: string
                              description:
                                type: string
                              subAttributes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    type:
                                      type: string
                                    multiValued:
                                      type: boolean
                                    required:
                                      type: boolean
                                    mutability:
                                      type: string
                                    returned:
                                      type: string
                                    description:
                                      type: string
                                  required:
                                  - name
                                  - type
                                  - multiValued
                                  - required
                                  - mutability
                                  - returned
                                  additionalProperties: false
                            required:
                            - name
                            - type
                            - multiValued
                            - required
                            - mutability
                            - returned
                            additionalProperties: false
                        meta:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              const: Schema
                            location:
                              type: string
                          required:
                          - resourceType
                          - location
                          additionalProperties: false
                      required:
                      - schemas
                      - id
                      - name
                      - description
                      - attributes
                      - meta
                      additionalProperties: false
                required:
                - schemas
                - totalResults
                - startIndex
                - itemsPerPage
                - Resources
                additionalProperties: false
      description: 'The attribute definitions for the User and Group resources (RFC 7643 section 7), which an identity provider reads to build its attribute mapping. A LangWatch group is an access group: its membership drives role bindings, and it is not a team. Unauthenticated, like the rest of SCIM discovery.'
      summary: List the SCIM resource schemas
      tags:
      - SCIM
      security: []
      x-access-policy:
        kind: public
        credential:
        - none
  /api/scim/v2/Users:
    get:
      operationId: scimListUsers
      responses:
        '200':
          description: A page of provisioned users.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:ListResponse
                  totalResults:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  startIndex:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  itemsPerPage:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  Resources:
                    type: array
                    items:
                      type: object
                      properties:
                        schemas:
                          type: array
                          items:
                            type: string
                            const: urn:ietf:params:scim:schemas:core:2.0:User
                        id:
                          type: string
                        externalId:
                          type: string
                        userName:
                          type: string
                        name:
                          type: object
                          properties:
                            givenName:
                              type: string
                            familyName:
                              type: string
                          required:
                          - givenName
                          - familyName
                          additionalProperties: false
                        emails:
                          type: array
                          items:
                            type: object
                            properties:
                              primary:
                                type: boolean
                              value:
                                type: string
                              type:
                                type: string
                            required:
                            - primary
                            - value
                            - type
                            additionalProperties: false
                        active:
                          type: boolean
                        meta:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              const: User
                            created:
                              type: string
                            lastModified:
                              type: string
                          required:
                          - resourceType
                          - created
                          - lastModified
                          additionalProperties: false
                      required:
                      - schemas
                      - id
                      - userName
                      - name
                      - emails
                      - active
                      - meta
                      additionalProperties: false
                required:
                - schemas
                - totalResults
                - startIndex
                - itemsPerPage
                - Resources
                additionalProperties: false
        '401':
          description: The Authorization header is missing, is not a bearer token, or names a token this deployment does not know.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '403':
          description: The token is valid but the organization's plan no longer includes SCIM provisioning. Entitlement is checked on every call, so a directory connection stops the moment the Enterprise plan lapses.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
      description: 'The members of the organization the token belongs to, as SCIM users. Two filter expressions are understood: `userName eq "someone@example.com"`, matched against the member''s email without regard to case, and `externalId eq "..."`, matched against the identifier the presented token''s own directory connection pushed. Any other filter is refused.'
      summary: List provisioned users
      tags:
      - SCIM
      security:
      - scim_bearer: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - scim_token
        permissions: []
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        description: A SCIM filter. Only `attribute eq "..."` is understood; any other expression is refused.
      - in: query
        name: startIndex
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        description: 1-based index of the first resource to return. Anything that does not parse as a positive integer is read as 1.
      - in: query
        name: count
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 100
        description: How many resources to return, capped at 100 (the `filter.maxResults` ServiceProviderConfig publishes). Anything that does not parse as a positive integer is read as 100, and anything above 100 is served as 100.
    post:
      operationId: scimCreateUser
      responses:
        '201':
          description: The provisioned user.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:schemas:core:2.0:User
                  id:
                    type: string
                  externalId:
                    type: string
                  userName:
                    type: string
                  name:
                    type: object
                    properties:
                      givenName:
                        type: string
                      familyName:
                        type: string
                    required:
                    - givenName
                    - familyName
                    additionalProperties: false
                  emails:
                    type: array
                    items:
                      type: object
                      properties:
                        primary:
                          type: boolean
                        value:
                          type: string
                        type:
                          type: string
                      required:
                      - primary
                      - value
                      - type
                      additionalProperties: false
                  active:
                    type: boolean
                  meta:
                    type: object
                    properties:
                      resourceType:
                        type: string
                        const: User
                      created:
                        type: string
                      lastModified:
                        type: string
                    required:
                    - resourceType
                    - created
                    - lastModified
                    additionalProperties: false
                required:
                - schemas
                - id
                - userName
                - name
                - emails
                - active
                - meta
                additionalProperties: false
        '400':
          description: The request body is not JSON, or does not match the SCIM schema for this operation.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '401':
          description: The Authorization header is missing, is not a bearer token, or names a token this deployment does not know.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '403':
          description: The token is valid but the organization's plan no longer includes SCIM provisioning. Entitlement is checked on every call, so a directory connection stops the moment the Enterprise plan lapses.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '409':
          description: A member with this userName already exists in the organization.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
      description: Adds a member to the organization, creating the LangWatch account when the email is new. Someone who already has an account is added and reactivated rather than refused, which is what lets a directory sync be re-run without special-casing the people it already knows. New members join with the MEMBER role at organization scope. `costCenter` on the enterprise user extension assigns their department, creating that department on first use.
      summary: Provision a user
      tags:
      - SCIM
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                schemas:
                  type: array
                  items:
                    type: string
                externalId:
                  type: string
                  minLength: 1
                userName:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                name:
                  type: object
                  properties:
                    givenName:
                      type: string
                    familyName:
                      type: string
                emails:
                  type: array
                  items:
                    type: object
                    properties:
                      primary:
                        type: boolean
                      value:
                        type: string
                      type:
                        type: string
                    required:
                    - value
                active:
                  type: boolean
                urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                  type: object
                  properties:
                    costCenter:
                      type:
                      - string
                      - 'null'
                  additionalProperties: {}
              required:
              - schemas
              - userName
              additionalProperties: {}
      security:
      - scim_bearer: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - scim_token
        permissions: []
  /api/scim/v2/Users/{id}:
    get:
      operationId: scimGetUser
      responses:
        '200':
          description: The user.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:schemas:core:2.0:User
                  id:
                    type: string
                  externalId:
                    type: string
                  userName:
                    type: string
                  name:
                    type: object
                    properties:
                      givenName:
                        type: string
                      familyName:
                        type: string
                    required:
                    - givenName
                    - familyName
                    additionalProperties: false
                  emails:
                    type: array
                    items:
                      type: object
                      properties:
                        primary:
                          type: boolean
                        value:
                          type: string
                        type:
                          type: string
                      required:
                      - primary
                      - value
                      - type
                      additionalProperties: false
                  active:
                    type: boolean
                  meta:
                    type: object
                    properties:
                      resourceType:
                        type: string
                        const: User
                      created:
                        type: string
                      lastModified:
                        type: string
                    required:
                    - resourceType
                    - created
                    - lastModified
                    additionalProperties: false
                required:
                - schemas
                - id
                - userName
                - name
                - emails
                - active
                - meta
                additionalProperties: false
        '401':
          description: The Authorization header is missing, is not a bearer token, or names a token this deployment does not know.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '403':
          description: The token is valid but the organization's plan no longer includes SCIM provisioning. Entitlement is checked on every call, so a directory connection stops the moment the Enterprise plan lapses.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '404':
          description: No such member in this organization.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
      description: Reads one member of the organization the token belongs to. An id that is not a member answers 404, whether or not it names a LangWatch account elsewhere.
      summary: Get a provisioned user
      tags:
      - SCIM
      security:
      - scim_bearer: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - scim_token
        permissions: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
    put:
      operationId: scimReplaceUser
      responses:
        '200':
          description: The updated user.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:schemas:core:2.0:User
                  id:
                    type: string
                  externalId:
                    type: string
                  userName:
                    type: string
                  name:
                    type: object
                    properties:
                      givenName:
                        type: string
                      familyName:
                        type: string
                    required:
                    - givenName
                    - familyName
                    additionalProperties: false
                  emails:
                    type: array
                    items:
                      type: object
                      properties:
                        primary:
                          type: boolean
                        value:
                          type: string
                        type:
                          type: string
                      required:
                      - primary
                      - value
                      - type
                      additionalProperties: false
                  active:
                    type: boolean
                  meta:
                    type: object
                    properties:
                      resourceType:
                        type: string
                        const: User
                      created:
                        type: string
                      lastModified:
                        type: string
                    required:
                    - resourceType
                    - created
                    - lastModified
                    additionalProperties: false
                required:
                - schemas
                - id
                - userName
                - name
                - emails
                - active
                - meta
                additionalProperties: false
        '400':
          description: The request body is not JSON, or does not match the SCIM schema for this operation.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '401':
          description: The Authorization header is missing, is not a bearer token, or names a token this deployment does not know.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '403':
          description: The token is valid but the organization's plan no longer includes SCIM provisioning. Entitlement is checked on every call, so a directory connection stops the moment the Enterprise plan lapses.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
        '404':
          description: No such member in this organization.
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      const: urn:ietf:params:scim:api:messages:2.0:Error
                  status:
                    type: string
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
                - detail
                additionalProperties: false
      description: 'Replaces the member''s attributes with the body. It is a whole-resource write, so an attribute the identity provider leaves out is reset rather than kept: omitting `active` reactivates the member. Send PATCH instead to change one attribute.'
      summary: Replace a provisioned user
      tags:
      - SCIM
      requestBody:
        required: true
        content:
