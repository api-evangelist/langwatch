                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - prompt
                          - http
                          - code
                          - workflow
                          - connected
                          - voice
                        referenceId:
                          type: string
                          minLength: 1
                        scenarioMappings:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  const: source
                                sourceId:
                                  type: string
                                  minLength: 1
                                path:
                                  type: array
                                  items:
                                    type: string
                              required:
                              - type
                              - sourceId
                              - path
                              additionalProperties: false
                            - type: object
                              properties:
                                type:
                                  type: string
                                  const: value
                                value:
                                  type: string
                              required:
                              - type
                              - value
                              additionalProperties: false
                        runParameters:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            anyOf:
                            - type: string
