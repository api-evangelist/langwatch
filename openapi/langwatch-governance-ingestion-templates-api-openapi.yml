openapi: 3.2.0
info:
  title: LangWatch Governance / Ingestion Templates API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Governance / Ingestion Templates
paths:
  /api/v1/governance/ingestion-templates:
    get:
      operationId: getApiGovernanceIngestionTemplates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        slug:
                          type: string
                        source_type:
                          type: string
                        display_name:
                          type: string
                        description:
                          type:
                          - string
                          - 'null'
                        icon_asset:
                          type:
                          - string
                          - 'null'
                        credential_schema:
                          type:
                          - string
                          - 'null'
                        ottl_rules:
                          type: string
                        platform_published:
                          type: boolean
                        enabled:
                          type: boolean
                        organization_id:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - slug
                      - source_type
                      - display_name
                      - description
                      - icon_asset
                      - credential_schema
                      - ottl_rules
                      - platform_published
                      - enabled
                      - organization_id
                      additionalProperties: false
                required:
                - data
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Returns the union of platform-published default templates and any org-authored templates visible to the caller's organization. Disabled / archived rows are filtered out. `ottl_rules` is empty in this end-user shape; admins use GET /ingestion-templates/admin to read the canonical OTTL.
      summary: List ingestion templates
      tags:
      - Governance / Ingestion Templates
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - aiTools:view
    post:
      operationId: postApiGovernanceIngestionTemplates
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion_template:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      source_type:
                        type: string
                      display_name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      icon_asset:
                        type:
                        - string
                        - 'null'
                      credential_schema:
                        type:
                        - string
                        - 'null'
                      ottl_rules:
                        type: string
                      platform_published:
                        type: boolean
                      enabled:
                        type: boolean
                      organization_id:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - slug
                    - source_type
                    - display_name
                    - description
                    - icon_asset
                    - credential_schema
                    - ottl_rules
                    - platform_published
                    - enabled
                    - organization_id
                    additionalProperties: false
                required:
                - ingestion_template
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Creates a brand-new template scoped to the caller's organization. Slug is auto-generated. Platform rows (organizationId IS NULL) are NEVER created via this endpoint — admins customize platform defaults via POST /ingestion-templates/clone instead.
      summary: Create org-authored ingestion template
      tags:
      - Governance / Ingestion Templates
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - aiTools:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_type:
                  type: string
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                description:
                  type: string
                  maxLength: 2000
                icon_asset:
                  type: string
                  maxLength: 20000
                credential_schema:
                  anyOf:
                  - type: string
                    enum:
                    - otlp_token
                    - static_api_key
                    - agent_id
                  - type: 'null'
                ottl_rules:
                  type: string
                  maxLength: 50000
              required:
              - source_type
              - display_name
  /api/v1/governance/ingestion-templates/admin:
    get:
      operationId: getApiGovernanceIngestionTemplatesAdmin
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        slug:
                          type: string
                        source_type:
                          type: string
                        display_name:
                          type: string
                        description:
                          type:
                          - string
                          - 'null'
                        icon_asset:
                          type:
                          - string
                          - 'null'
                        credential_schema:
                          type:
                          - string
                          - 'null'
                        ottl_rules:
                          type: string
                        platform_published:
                          type: boolean
                        enabled:
                          type: boolean
                        organization_id:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - slug
                      - source_type
                      - display_name
                      - description
                      - icon_asset
                      - credential_schema
                      - ottl_rules
                      - platform_published
                      - enabled
                      - organization_id
                      additionalProperties: false
                required:
                - data
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Same union as the user list but includes the canonical `ottl_rules` source for every row. Used by admin tooling to render the transparency block / authoring drawer.
      summary: List ingestion templates (admin shape, includes OTTL)
      tags:
      - Governance / Ingestion Templates
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - aiTools:manage
  /api/v1/governance/ingestion-templates/{ingestionTemplateId}:
    get:
      operationId: getApiGovernanceIngestionTemplatesById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion_template:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      source_type:
                        type: string
                      display_name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      icon_asset:
                        type:
                        - string
                        - 'null'
                      credential_schema:
                        type:
                        - string
                        - 'null'
                      ottl_rules:
                        type: string
                      platform_published:
                        type: boolean
                      enabled:
                        type: boolean
                      organization_id:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - slug
                    - source_type
                    - display_name
                    - description
                    - icon_asset
                    - credential_schema
                    - ottl_rules
                    - platform_published
                    - enabled
                    - organization_id
                    additionalProperties: false
                required:
                - ingestion_template
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Single-template lookup by id, scoped to the caller's organization, including the canonical `ottl_rules`. Cross-org probes collapse to 404 (no enumeration vector). Members read the same row without `ottl_rules` from GET /ingestion-templates.
      summary: Get ingestion template
      tags:
      - Governance / Ingestion Templates
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - aiTools:manage
      parameters:
      - in: path
        name: ingestionTemplateId
        schema:
          type: string
          minLength: 1
        required: true
    delete:
      operationId: deleteApiGovernanceIngestionTemplatesById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived:
                    type: boolean
                    const: true
                required:
                - archived
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: Marks the row archived; existing ingestion keys continue to land traces but the row disappears from list views. Platform-published rows reject with 403.
      summary: Soft-archive an org-authored template
      tags:
      - Governance / Ingestion Templates
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - aiTools:manage
      parameters:
      - in: path
        name: ingestionTemplateId
        schema:
          type: string
          minLength: 1
        required: true
  /api/v1/governance/ingestion-templates/{ingestionTemplateId}/ottl-rules:
    patch:
      operationId: patchApiGovernanceIngestionTemplatesByIdOttlRules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion_template:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      source_type:
                        type: string
                      display_name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      icon_asset:
                        type:
                        - string
                        - 'null'
                      credential_schema:
                        type:
                        - string
                        - 'null'
                      ottl_rules:
                        type: string
                      platform_published:
                        type: boolean
                      enabled:
                        type: boolean
                      organization_id:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - slug
                    - source_type
                    - display_name
                    - description
                    - icon_asset
                    - credential_schema
                    - ottl_rules
                    - platform_published
                    - enabled
                    - organization_id
                    additionalProperties: false
                required:
