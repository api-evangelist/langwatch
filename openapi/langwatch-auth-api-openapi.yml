                    - string
                    - 'null'
                  toolPolicies:
                    type: object
                    properties:
                      claude:
                        type: object
                        properties:
                          allowVk:
                            type: boolean
                          allowOtelDirect:
                            type: boolean
                        required:
                        - allowVk
                        - allowOtelDirect
                        additionalProperties: false
                      codex:
