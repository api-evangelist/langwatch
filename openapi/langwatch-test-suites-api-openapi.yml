      - Test Suites
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The new name. The slug is kept.
                  type: string
                  minLength: 1
                  maxLength: 200
                fields:
                  description: 'The full list of fields the suite declares. A field an attached evaluator still reads cannot be removed: answers 422 suite_field_in_use.'
                  maxItems: 30
                  type: array
                  items:
                    type: object
                    properties:
                      identifier:
