                                  input_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                  output_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                  cache_read_input_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                  cache_creation_input_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                  reasoning_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                  input_image_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                    description: Image tokens billed on the input side, disjoint from input_tokens.
                                  output_image_tokens:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                    description: Image tokens the answer was billed for, disjoint from output_tokens.
                                  image_count:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                    description: 'Images the request carried. Display only: never part of a cost sum.'
                                required:
                                - input_tokens
                                - output_tokens
                                - cache_read_input_tokens
                                - cache_creation_input_tokens
                                - reasoning_tokens
                                - input_image_tokens
                                - output_image_tokens
                                - image_count
                                additionalProperties: false
                              - type: 'null'
                            cost:
                              anyOf:
                              - type: object
                                properties:
                                  total_usd:
                                    type: string
                                    description: Display value. Use nano_usd for arithmetic.
                                  nano_usd:
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                    description: Canonical integer cost, nano-USD.
                                  rate_version:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - total_usd
                                - nano_usd
                                additionalProperties: false
                              - type: 'null'
                            status:
