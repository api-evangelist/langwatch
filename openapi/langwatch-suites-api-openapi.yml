openapi: 3.2.0
info:
  title: LangWatch Suites API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Suites
paths:
  /api/v1/suites:
    get:
      operationId: getApiSuites
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    slug:
                      type: string
                    kind:
                      description: custom is a hand-assembled run plan; folder is a test suite that groups scenarios filed into it. Absent on servers that predate test suites.
                      type: string
                      enum:
                      - custom
                      - folder
                    description:
                      type:
                      - string
                      - 'null'
                    scenarioIds:
                      type: array
                      items:
                        type: string
                    scope:
                      anyOf:
                      - oneOf:
                        - type: object
                          properties:
                            mode:
                              type: string
                              const: all
                          required:
                          - mode
                          additionalProperties: false
                        - type: object
                          properties:
                            mode:
                              type: string
                              const: folders
                            folderIds:
                              type: array
                              items:
                                type: string
                          required:
                          - mode
                          - folderIds
                          additionalProperties: false
                        - type: object
                          properties:
                            mode:
                              type: string
                              const: labels
                            labels:
                              type: array
                              items:
                                type: string
                          required:
                          - mode
                          - labels
                          additionalProperties: false
                        - type: object
                          properties:
                            mode:
                              type: string
                              const: cases
                          required:
                          - mode
                          additionalProperties: false
                        description: 'What the run plan covers: all (every active scenario), folders (the scenarios filed in the named test suites), labels (the scenarios carrying any of the labels), or cases (the scenarioIds below). A dynamic scope is resolved again at every run, so a scenario written later runs without editing the plan.'
                      - type: 'null'
                    targets:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - prompt
                            - http
                            - code
                            - workflow
                            - connected
                            - voice
                          referenceId:
                            type: string
                            minLength: 1
                          scenarioMappings:
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties:
                              oneOf:
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    const: source
                                  sourceId:
                                    type: string
                                    minLength: 1
                                  path:
                                    type: array
                                    items:
                                      type: string
                                required:
                                - type
                                - sourceId
                                - path
                                additionalProperties: false
                              - type: object
                                properties:
                                  type:
                                    type: string
                                    const: value
                                  value:
                                    type: string
                                required:
                                - type
                                - value
                                additionalProperties: false
                          runParameters:
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties:
                              anyOf:
                              - type: string
                                maxLength: 4096
                              - type: number
                              - type: boolean
                          runSecretParameterNames:
                            maxItems: 50
                            type: array
                            items:
                              type: string
                              maxLength: 64
                        required:
                        - type
                        - referenceId
                        additionalProperties: false
                    repeatCount:
                      type: number
                    labels:
                      type: array
                      items:
                        type: string
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    platformUrl:
                      type: string
                      format: uri
                  required:
                  - id
                  - name
                  - slug
                  - description
                  - scenarioIds
                  - targets
                  - repeatCount
                  - labels
                  - createdAt
                  - updatedAt
                  - platformUrl
                  additionalProperties: false
      description: 'List all non-archived suites for the project. By default only custom run plans are returned; pass kind=folder for test suites. Deprecated: use /api/v1/run-plans and /api/v1/test-suites.'
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:view
      deprecated: true
      parameters:
      - in: query
        name: kind
        schema:
          default: custom
          type: string
          enum:
          - custom
          - folder
        description: Which kind of suite to list. Defaults to custom, so callers that predate test suites keep seeing exactly the run plans they always did.
      tags:
      - Suites
      summary: Get api suites
      x-summary-source: derived
    post:
      operationId: postApiSuites
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  kind:
                    description: custom is a hand-assembled run plan; folder is a test suite that groups scenarios filed into it. Absent on servers that predate test suites.
                    type: string
                    enum:
                    - custom
                    - folder
                  description:
                    type:
                    - string
                    - 'null'
                  scenarioIds:
                    type: array
                    items:
                      type: string
                  scope:
                    anyOf:
                    - oneOf:
                      - type: object
                        properties:
                          mode:
                            type: string
                            const: all
                        required:
                        - mode
                        additionalProperties: false
                      - type: object
                        properties:
                          mode:
                            type: string
                            const: folders
                          folderIds:
                            type: array
                            items:
                              type: string
                        required:
                        - mode
                        - folderIds
                        additionalProperties: false
                      - type: object
                        properties:
                          mode:
                            type: string
                            const: labels
                          labels:
                            type: array
                            items:
                              type: string
                        required:
                        - mode
                        - labels
                        additionalProperties: false
                      - type: object
                        properties:
                          mode:
                            type: string
                            const: cases
                        required:
                        - mode
                        additionalProperties: false
                      description: 'What the run plan covers: all (every active scenario), folders (the scenarios filed in the named test suites), labels (the scenarios carrying any of the labels), or cases (the scenarioIds below). A dynamic scope is resolved again at every run, so a scenario written later runs without editing the plan.'
                    - type: 'null'
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - prompt
                          - http
                          - code
                          - workflow
                          - connected
                          - voice
                        referenceId:
                          type: string
                          minLength: 1
                        scenarioMappings:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  const: source
                                sourceId:
                                  type: string
                                  minLength: 1
                                path:
                                  type: array
                                  items:
                                    type: string
                              required:
                              - type
                              - sourceId
                              - path
                              additionalProperties: false
                            - type: object
                              properties:
                                type:
                                  type: string
                                  const: value
                                value:
                                  type: string
                              required:
                              - type
                              - value
                              additionalProperties: false
                        runParameters:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            anyOf:
                            - type: string
                              maxLength: 4096
                            - type: number
                            - type: boolean
                        runSecretParameterNames:
                          maxItems: 50
                          type: array
                          items:
                            type: string
                            maxLength: 64
                      required:
                      - type
                      - referenceId
                      additionalProperties: false
                  repeatCount:
                    type: number
                  labels:
                    type: array
                    items:
                      type: string
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  platformUrl:
                    type: string
                    format: uri
                required:
                - id
                - name
                - slug
                - description
                - scenarioIds
                - targets
                - repeatCount
                - labels
                - createdAt
                - updatedAt
                - platformUrl
                additionalProperties: false
      description: 'Create a new suite (run plan). Deprecated: use /api/v1/run-plans and /api/v1/test-suites.'
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:create
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                kind:
                  default: custom
                  description: custom (the default) is a run plan and needs scenarioIds and targets; folder is a test suite that starts empty and gets scenarios by filing them into it.
                  type: string
                  enum:
                  - custom
                  - folder
                description:
                  type: string
                scenarioIds:
                  default: []
                  type: array
                  items:
                    type: string
                scope:
                  oneOf:
                  - type: object
                    properties:
                      mode:
                        type: string
                        const: all
                    required:
                    - mode
                  - type: object
                    properties:
                      mode:
                        type: string
                        const: folders
                      folderIds:
                        type: array
                        items:
                          type: string
                    required:
                    - mode
                    - folderIds
                  - type: object
                    properties:
                      mode:
                        type: string
                        const: labels
                      labels:
                        type: array
                        items:
                          type: string
                    required:
                    - mode
                    - labels
                  - type: object
                    properties:
                      mode:
                        type: string
                        const: cases
                    required:
                    - mode
                  description: 'What the run plan covers: all (every active scenario), folders (the scenarios filed in the named test suites), labels (the scenarios carrying any of the labels), or cases (the scenarioIds below). A dynamic scope is resolved again at every run, so a scenario written later runs without editing the plan.'
                targets:
