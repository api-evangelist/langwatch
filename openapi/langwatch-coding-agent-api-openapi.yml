openapi: 3.2.0
info:
  title: LangWatch Coding Agent API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Coding Agent
paths:
  /api/v1/coding-agent/sessions/{sessionId}/events:
    get:
      operationId: getApiCodingAgentSessionsBySessionIdEvents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        sessionId:
                          type: string
                        timeUnixMs:
                          type: number
                        recordId:
                          type: string
                        eventKind:
                          type: string
                        agent:
                          type: string
                        sessionKeySource:
                          type: string
                        traceId:
                          type: string
                        spanId:
                          type: string
                        promptId:
                          type: string
                        querySource:
                          type: string
                        agentType:
                          type: string
                        eventSequence:
                          type: number
                        requestId:
                          type: string
                        model:
                          type: string
                        inputTokens:
                          type: number
                        outputTokens:
                          type: number
                        cacheReadTokens:
                          type: number
                        cacheCreationTokens:
                          type: number
                        costUsd:
                          type: number
                        durationMs:
                          type: number
                        ttftMs:
                          type: number
                        attempt:
                          type: number
                        speed:
                          type: string
                        stopReason:
                          type: string
                        preTokens:
                          type: number
                        postTokens:
                          type: number
                        compactionTrigger:
                          type: string
                        precomputeReuse:
                          type: string
                        statusCode:
                          type: string
                        errorType:
                          type: string
                        rateLimitCarrier:
                          type: string
                        retryDurationMs:
                          type: number
                        toolName:
                          type: string
                        success:
                          type: string
                        decision:
                          type: string
                        decisionSource:
                          type: string
                        toolInputBytes:
                          type: number
                        toolResultBytes:
                          type: number
                        promptChars:
                          type: number
                        totalTokens:
                          type: number
                        repositoryHost:
                          type: string
                        repositoryOwner:
                          type: string
                        repositoryName:
                          type: string
                        branch:
                          type: string
                      required:
                      - sessionId
                      - timeUnixMs
                      - recordId
                      - eventKind
                      - agent
                      - sessionKeySource
                      - traceId
                      - spanId
                      - promptId
                      - querySource
                      - agentType
                      - eventSequence
                      - requestId
                      - model
                      - inputTokens
                      - outputTokens
                      - cacheReadTokens
                      - cacheCreationTokens
                      - costUsd
                      - durationMs
                      - ttftMs
                      - attempt
                      - speed
                      - stopReason
                      - preTokens
                      - postTokens
                      - compactionTrigger
                      - precomputeReuse
                      - statusCode
                      - errorType
                      - rateLimitCarrier
                      - retryDurationMs
                      - toolName
                      - success
                      - decision
                      - decisionSource
                      - toolInputBytes
                      - toolResultBytes
                      - promptChars
                      - totalTokens
                      - repositoryHost
                      - repositoryOwner
                      - repositoryName
                      - branch
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                required:
                - events
                - nextCursor
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
