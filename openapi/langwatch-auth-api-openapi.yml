                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                          minLength: 1
                        displayName:
                          type: string
                          minLength: 1
                      required:
                      - slug
                      - displayName
                      additionalProperties: false
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        displayName:
                          type: string
