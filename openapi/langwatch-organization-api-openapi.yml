openapi: 3.2.0
info:
  title: LangWatch Organization API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Organization
paths:
  /api/v1/organization:
    get:
      operationId: getOrganization
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                  slug:
                    type: string
                  supportContact:
                    type:
                    - string
                    - 'null'
                  presenceEnabled:
                    type: boolean
                  traceSharingEnabled:
                    type: boolean
                  primaryIntent:
                    anyOf:
                    - type: string
                      enum:
                      - AGENT_GOVERNANCE
                      - LLM_OPS
                    - type: 'null'
                  s3Endpoint:
                    type:
                    - string
                    - 'null'
                  s3AccessKeyId:
                    type:
                    - string
                    - 'null'
                  s3Bucket:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - name
                - slug
                - supportContact
                - presenceEnabled
                - traceSharingEnabled
                - primaryIntent
                - s3Endpoint
                - s3AccessKeyId
                - s3Bucket
                - createdAt
                - updatedAt
                additionalProperties: false
      description: 'Read the organization profile: name, slug, support contact, presence and trace sharing settings, and the S3 storage shape. The single sign-on fields and the S3 secret are never returned.'
      tags:
      - Organization
      security:
      - admin_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - organization_api_key
        permissions:
        - organization:view
      summary: Get organization
      x-summary-source: derived
    patch:
      operationId: updateOrganization
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                  slug:
                    type: string
                  supportContact:
                    type:
                    - string
                    - 'null'
                  presenceEnabled:
                    type: boolean
                  traceSharingEnabled:
                    type: boolean
                  primaryIntent:
                    anyOf:
                    - type: string
                      enum:
                      - AGENT_GOVERNANCE
                      - LLM_OPS
                    - type: 'null'
                  s3Endpoint:
                    type:
                    - string
                    - 'null'
                  s3AccessKeyId:
                    type:
                    - string
                    - 'null'
                  s3Bucket:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - name
                - slug
                - supportContact
                - presenceEnabled
                - traceSharingEnabled
                - primaryIntent
                - s3Endpoint
                - s3AccessKeyId
                - s3Bucket
                - createdAt
                - updatedAt
                additionalProperties: false
      description: 'Update the organization profile. Partial: only the fields present are written, and the response is exactly what a subsequent GET returns.'
      tags:
      - Organization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                supportContact:
                  anyOf:
                  - type: string
                    maxLength: 255
                  - type: 'null'
                presenceEnabled:
                  type: boolean
                traceSharingEnabled:
                  type: boolean
                primaryIntent:
                  anyOf:
                  - type: string
                    enum:
                    - AGENT_GOVERNANCE
                    - LLM_OPS
                  - type: 'null'
                s3Endpoint:
                  anyOf:
                  - type: string
                    maxLength: 2048
                  - type: 'null'
                s3AccessKeyId:
                  anyOf:
                  - type: string
                    maxLength: 1024
                  - type: 'null'
                s3SecretAccessKey:
                  anyOf:
                  - type: string
                    maxLength: 1024
                  - type: 'null'
                s3Bucket:
                  anyOf:
                  - type: string
                    maxLength: 1024
                  - type: 'null'
      security:
      - admin_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - organization_api_key
        permissions:
        - organization:manage
      summary: Update organization
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
