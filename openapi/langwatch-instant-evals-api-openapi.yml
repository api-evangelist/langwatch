      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:manage
  /api/v1/instant-evals/{id}:
    get:
      operationId: getInstantEvalRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The run id.
                  name:
                    description: What the run was called, if anything.
                    type:
                    - string
                    - 'null'
                  sql:
                    type: string
