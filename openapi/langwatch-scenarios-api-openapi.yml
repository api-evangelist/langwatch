openapi: 3.2.0
info:
  title: LangWatch Scenarios API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Scenarios
paths:
  /api/v1/scenarios:
    get:
      operationId: getApiScenarios
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    situation:
                      type: string
                    criteria:
                      type: array
                      items:
                        type: string
                    labels:
                      type: array
                      items:
                        type: string
                    parameters:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          description:
                            type: string
                            maxLength: 500
                          defaultValue:
                            anyOf:
                            - type: string
                              maxLength: 4096
                            - type: number
                            - type: boolean
                          secret:
                            type: boolean
                          type:
                            type: string
                            enum:
                            - string
                            - number
                            - boolean
                          options:
                            maxItems: 50
                            type: array
                            items:
                              anyOf:
                              - type: string
                                maxLength: 4096
                              - type: number
                              - type: boolean
                          required:
                            type: boolean
                        required:
                        - name
                        additionalProperties: false
                    simulatorModel:
                      description: The model that plays the user, or null for the project default. Absent on servers that predate model overrides on this family.
                      type:
                      - string
                      - 'null'
                    judgeModel:
                      description: The model that judges the run, or null for the project default. Absent on servers that predate model overrides on this family.
                      type:
                      - string
                      - 'null'
                    maxTurns:
                      description: The most conversation turns a run of this scenario takes, or null for the default. Absent on servers that predate turn limits on this family.
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                    minTurns:
                      description: The fewest conversation turns before the judge may end a run, or null for the default. Absent on servers that predate turn limits on this family.
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                    testSuiteId:
                      description: The test suite this scenario is filed in, or null when unfiled. Absent on servers that predate test suites.
                      type:
                      - string
                      - 'null'
                    fields:
                      description: The value this scenario carries for each field its test suite declares, keyed by field identifier. A field with no value has no key. Absent on servers that predate suite fields.
                      type: object
                      propertyNames:
                        type: string
                        maxLength: 64
                      additionalProperties:
                        anyOf:
                        - type: string
                          maxLength: 65536
                        - type: number
                        - type: boolean
                    platformUrl:
                      type: string
                      format: uri
                  required:
                  - id
                  - name
                  - situation
                  - criteria
                  - labels
                  - parameters
                  - platformUrl
                  additionalProperties: false
      description: Get all scenarios for a project
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:view
      tags:
      - Scenarios
      summary: Get api scenarios
      x-summary-source: derived
    post:
      operationId: postApiScenarios
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  situation:
                    type: string
                  criteria:
                    type: array
                    items:
                      type: string
                  labels:
                    type: array
                    items:
                      type: string
                  parameters:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                        description:
                          type: string
                          maxLength: 500
                        defaultValue:
                          anyOf:
                          - type: string
                            maxLength: 4096
                          - type: number
                          - type: boolean
                        secret:
                          type: boolean
                        type:
                          type: string
                          enum:
                          - string
                          - number
                          - boolean
                        options:
                          maxItems: 50
                          type: array
                          items:
                            anyOf:
                            - type: string
                              maxLength: 4096
                            - type: number
                            - type: boolean
                        required:
                          type: boolean
                      required:
                      - name
                      additionalProperties: false
                  simulatorModel:
                    description: The model that plays the user, or null for the project default. Absent on servers that predate model overrides on this family.
                    type:
                    - string
                    - 'null'
                  judgeModel:
                    description: The model that judges the run, or null for the project default. Absent on servers that predate model overrides on this family.
                    type:
                    - string
                    - 'null'
                  maxTurns:
                    description: The most conversation turns a run of this scenario takes, or null for the default. Absent on servers that predate turn limits on this family.
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  minTurns:
                    description: The fewest conversation turns before the judge may end a run, or null for the default. Absent on servers that predate turn limits on this family.
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                  testSuiteId:
                    description: The test suite this scenario is filed in, or null when unfiled. Absent on servers that predate test suites.
                    type:
                    - string
                    - 'null'
                  fields:
                    description: The value this scenario carries for each field its test suite declares, keyed by field identifier. A field with no value has no key. Absent on servers that predate suite fields.
                    type: object
                    propertyNames:
                      type: string
                      maxLength: 64
                    additionalProperties:
                      anyOf:
                      - type: string
                        maxLength: 65536
                      - type: number
                      - type: boolean
                  platformUrl:
                    type: string
                    format: uri
                required:
                - id
                - name
                - situation
                - criteria
                - labels
                - parameters
                - platformUrl
                additionalProperties: false
      description: Create a new scenario
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                situation:
                  type: string
                criteria:
                  default: []
                  type: array
                  items:
                    type: string
                labels:
                  default: []
                  type: array
                  items:
                    type: string
                parameters:
                  description: 'The parameters this scenario declares by name, each with an optional description and default. A run supplies values for these names, readable from the scenario''s own text as params.NAME. A parameter marked secret carries no default: its value is supplied per run, encrypted, delivered to the target as secrets.NAME, and never readable from the scenario''s own text.'
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      description:
                        type: string
                        maxLength: 500
                      defaultValue:
                        anyOf:
                        - type: string
                          maxLength: 4096
                        - type: number
                        - type: boolean
                      secret:
                        type: boolean
                      type:
                        type: string
                        enum:
                        - string
                        - number
                        - boolean
                      options:
                        maxItems: 50
                        type: array
                        items:
                          anyOf:
                          - type: string
                            maxLength: 4096
                          - type: number
                          - type: boolean
                      required:
                        type: boolean
                    required:
                    - name
                    additionalProperties: false
                simulatorModel:
                  description: Model for the simulated user, e.g. openai/gpt-5-mini. Null uses the project default.
                  anyOf:
                  - type: string
                    maxLength: 200
                    pattern: ^[a-zA-Z0-9_-]+(?:\/[^\s/]+)+$
                  - type: 'null'
                judgeModel:
                  description: Model for the judge, e.g. openai/gpt-5-mini. Null uses the project default.
                  anyOf:
                  - type: string
                    maxLength: 200
                    pattern: ^[a-zA-Z0-9_-]+(?:\/[^\s/]+)+$
                  - type: 'null'
                maxTurns:
                  description: Maximum conversation turns for a run of this scenario. Null uses the default.
                  anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 100
                  - type: 'null'
                minTurns:
                  description: Minimum conversation turns before the judge may end the run. Null uses the default.
                  anyOf:
                  - type: integer
                    minimum: 0
                    maximum: 100
                  - type: 'null'
                testSuiteId:
                  description: The test suite to file this scenario in. It must name a non-archived test suite of the same project. null files the scenario into the project's Default test suite.
                  type:
                  - string
                  - 'null'
                fields:
                  description: 'The value for each field the test suite declares, keyed by field identifier: text, a number or a boolean, in the field''s own type. A field the suite does not declare answers 422 scenario_field_unknown; a value of the wrong type answers 422 scenario_field_type_invalid. An empty value clears the field.'
                  type: object
                  propertyNames:
                    type: string
                    maxLength: 64
                  additionalProperties:
                    anyOf:
                    - type: string
                      maxLength: 65536
                    - type: number
                    - type: boolean
              required:
              - name
              - situation
      tags:
      - Scenarios
      summary: Post api scenarios
      x-summary-source: derived
