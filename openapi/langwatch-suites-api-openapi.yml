      description: 'Trigger a suite run. Schedules scenario executions for all active scenarios x targets x repeatCount. When the id names a test suite, the targets, the repeat count and the models are read from the body. Deprecated: use /api/v1/run-plans and /api/v1/test-suites.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey:
                  type: string
                name:
                  description: The run plan this run joins or creates. Used only when the id names a test suite; derived from the suite name and the targets when absent.
                  type: string
                  minLength: 1
                  maxLength: 200
                targets:
                  description: The prompts, agents or workflows the run goes against. Read only when the id names a test suite, which stores no target of its own; a run plan already holds its own and refuses these.
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - prompt
                        - http
                        - code
                        - workflow
                        - connected
                        - voice
