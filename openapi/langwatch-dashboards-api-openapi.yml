openapi: 3.2.0
info:
  title: LangWatch Dashboards API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Dashboards
paths:
  /api/v1/dashboards:
    get:
      operationId: getApiDashboards
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        name:
                          type: string
                          minLength: 1
                          maxLength: 255
                        order:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        platformUrl:
                          type: string
                        graphCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                      - id
                      - name
                      - order
                      - createdAt
                      - updatedAt
                      - platformUrl
                      - graphCount
                      additionalProperties: false
                required:
                - data
                additionalProperties: false
      description: List all dashboards for the project with graph counts
      tags:
      - Dashboards
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:view
      summary: Get api dashboards
      x-summary-source: derived
    post:
      operationId: postApiDashboards
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  order:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  platformUrl:
                    type: string
                required:
                - id
                - name
                - order
                - createdAt
                - updatedAt
                - platformUrl
                additionalProperties: false
      description: Create a new dashboard
      tags:
      - Dashboards
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
              - name
      summary: Post api dashboards
      x-summary-source: derived
  /api/v1/dashboards/reorder:
    put:
      operationId: putApiDashboardsReorder
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                required:
                - success
                additionalProperties: false
      description: Reorder dashboards by providing an ordered list of IDs
      tags:
      - Dashboards
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dashboardIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    minLength: 1
              required:
              - dashboardIds
      summary: Put api dashboards reorder
      x-summary-source: derived
  /api/v1/dashboards/{id}:
    get:
      operationId: getApiDashboardsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  order:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  platformUrl:
                    type: string
                  graphs:
                    type: array
                    items:
                      type: object
                      properties:
                        gridColumn:
                          type: integer
                          minimum: 0
                          maximum: 7
                        gridRow:
                          type: integer
                          minimum: 0
                          maximum: 2000000000
                        colSpan:
                          type: integer
                          minimum: 1
                          maximum: 8
                        rowSpan:
                          type: integer
                          minimum: 1
                          maximum: 20
                        id:
                          type: string
                          minLength: 1
                        projectId:
                          type: string
                          minLength: 1
                        name:
                          type: string
                          minLength: 1
                        graph:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                        filters:
                          anyOf:
                          - type: object
                            propertyNames:
                              type: string
                            additionalProperties: {}
                          - type: 'null'
                        dashboardId:
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: 'null'
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - gridColumn
                      - gridRow
                      - colSpan
                      - rowSpan
                      - id
                      - projectId
                      - name
                      - graph
                      - filters
                      - dashboardId
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                required:
                - id
                - name
                - order
                - createdAt
                - updatedAt
                - platformUrl
                - graphs
                additionalProperties: false
      description: Get a dashboard by its id, including its graphs
      tags:
      - Dashboards
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:view
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      summary: Get api dashboards by id
      x-summary-source: derived
    patch:
      operationId: patchApiDashboardsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  order:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  platformUrl:
                    type: string
                required:
                - id
                - name
                - order
                - createdAt
                - updatedAt
                - platformUrl
                additionalProperties: false
      description: Rename a dashboard
      tags:
      - Dashboards
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
              - name
      summary: Patch api dashboards by id
      x-summary-source: derived
    delete:
      operationId: deleteApiDashboardsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                required:
                - id
                - name
                additionalProperties: false
      description: Delete a dashboard and its graphs (hard delete, cascade)
      tags:
      - Dashboards
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:manage
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      summary: Delete api dashboards by id
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
