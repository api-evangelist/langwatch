                  - error_type
                  - details
        '400':
          description: The body was not valid JSON, failed validation, or omitted a field this evaluator requires
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                - error
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                - error
        '403':
          description: The API key lacks evaluations:manage
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
