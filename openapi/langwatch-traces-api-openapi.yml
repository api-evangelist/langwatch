      description: Returns single trace details based on the ID supplied
      tags:
      - Traces
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - traces:view
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
        description: The trace ID.
      - in: query
        name: format
        schema:
          type: string
        description: 'Output format: ''digest'' (AI-readable) or ''json'' (full raw data, default)'
      - in: query
        name: llmMode
        schema:
          type: string
        description: 'Deprecated: use format=digest instead'
      summary: Get api trace id
      x-summary-source: derived
  /api/trace/{id}/share:
    post:
      operationId: postApiTraceIdShare
      responses:
        '200':
          description: Public path created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: success
                  path:
                    type: string
                required:
                - status
                - path
      description: Returns a public path for a trace
      tags:
      - Traces
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - traces:share
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
        description: The trace ID.
      summary: Post api trace id share
      x-summary-source: derived
  /api/trace/{id}/unshare:
