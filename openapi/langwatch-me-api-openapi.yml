openapi: 3.2.0
info:
  title: LangWatch Me API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Me
paths:
  /api/v1/me/usage:
    get:
      operationId: getApiMeUsage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      spentUsd:
                        type: number
                      billedUsd:
                        type: number
                      requests:
                        type: number
                      promptTokens:
                        type: number
                      completionTokens:
                        type: number
                      mostUsedModel:
                        anyOf:
                        - type: object
                          properties:
                            name:
                              type: string
                            usagePct:
                              type: number
                          required:
                          - name
                          - usagePct
                          additionalProperties: false
                        - type: 'null'
                    required:
                    - spentUsd
                    - billedUsd
                    - requests
                    - promptTokens
                    - completionTokens
                    - mostUsedModel
                    additionalProperties: false
                  dailyBuckets:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                        spentUsd:
                          type: number
                        billedUsd:
                          type: number
                        requests:
                          type: number
                      required:
                      - day
                      - spentUsd
                      - billedUsd
                      - requests
                      additionalProperties: false
                  breakdownByModel:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        spentUsd:
                          type: number
                        billedUsd:
                          type: number
                        requests:
                          type: number
                      required:
                      - label
                      - spentUsd
                      - billedUsd
                      - requests
                      additionalProperties: false
                required:
                - summary
                - dailyBuckets
                - breakdownByModel
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: 'Personal AI usage for the current month (or an explicit window): spend, billed spend, request + token counts, per-day buckets, and per-model breakdown. Requires a personal-project API key.'
      tags:
      - Me
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:view
      parameters:
      - in: query
        name: windowStartMs
        schema:
          type: integer
          minimum: -8640000000000000
          maximum: 8640000000000000
      - in: query
        name: windowEndMs
        schema:
          type: integer
          minimum: -8640000000000000
          maximum: 8640000000000000
      summary: Get api me usage
      x-summary-source: derived
  /api/v1/me/project:
    get:
      operationId: getApiMeProject
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  isPersonal:
                    type: boolean
                required:
                - id
                - name
                - slug
                - isPersonal
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
      description: 'Identity of the project the calling API key belongs to: id, name, slug and whether it is a personal workspace project. Lets a client (the CLI''s identity notice, a widget) say which project a key targets without any further access.'
      tags:
      - Me
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:view
      summary: Get api me project
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
