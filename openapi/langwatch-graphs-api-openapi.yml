openapi: 3.2.0
info:
  title: LangWatch Graphs API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Graphs
paths:
  /api/v1/graphs:
    get:
      operationId: getApiGraphs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    graph:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties: {}
                    filters:
                      anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      - type: 'null'
                    dashboardId:
                      type:
                      - string
                      - 'null'
                    gridColumn:
                      type: number
                    gridRow:
                      type: number
                    colSpan:
                      type: number
                    rowSpan:
                      type: number
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                  required:
                  - id
                  - name
                  - graph
                  - filters
                  - dashboardId
                  - gridColumn
                  - gridRow
                  - colSpan
                  - rowSpan
                  - createdAt
                  - updatedAt
                  additionalProperties: false
      description: List all custom graphs, optionally filtered by dashboard
      tags:
      - Graphs
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:view
      parameters:
      - in: query
        name: dashboardId
        schema:
          type: string
      summary: Get api graphs
      x-summary-source: derived
    post:
      operationId: postApiGraphs
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  graph:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  filters:
                    anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties: {}
                    - type: 'null'
                  dashboardId:
                    type:
                    - string
                    - 'null'
                  gridColumn:
                    type: number
                  gridRow:
                    type: number
                  colSpan:
                    type: number
                  rowSpan:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                required:
                - id
                - name
                - graph
                - filters
                - dashboardId
                - gridColumn
                - gridRow
                - colSpan
                - rowSpan
                - createdAt
                - updatedAt
                additionalProperties: false
      description: Create a custom graph on a dashboard
      tags:
      - Graphs
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                graph:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                dashboardId:
                  type: string
                filters:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                gridColumn:
                  type: number
                  minimum: 0
                  maximum: 1
                gridRow:
                  type: number
                  minimum: 0
                colSpan:
                  type: number
                  minimum: 1
                  maximum: 2
                rowSpan:
                  type: number
                  minimum: 1
                  maximum: 2
              required:
              - name
              - graph
      summary: Post api graphs
      x-summary-source: derived
  /api/v1/graphs/{id}:
    get:
      operationId: getApiGraphsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  graph:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  filters:
                    anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties: {}
                    - type: 'null'
                  dashboardId:
                    type:
                    - string
                    - 'null'
                  gridColumn:
                    type: number
                  gridRow:
                    type: number
                  colSpan:
                    type: number
                  rowSpan:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                required:
                - id
                - name
                - graph
                - filters
                - dashboardId
                - gridColumn
                - gridRow
                - colSpan
                - rowSpan
                - createdAt
                - updatedAt
                additionalProperties: false
      description: Get a custom graph by its ID
      tags:
      - Graphs
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:view
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      summary: Get api graphs by id
      x-summary-source: derived
    patch:
      operationId: patchApiGraphsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  graph:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  filters:
                    anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties: {}
                    - type: 'null'
                  dashboardId:
                    type:
                    - string
                    - 'null'
                  gridColumn:
                    type: number
                  gridRow:
                    type: number
                  colSpan:
                    type: number
                  rowSpan:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                required:
                - id
                - name
                - graph
                - filters
                - dashboardId
                - gridColumn
                - gridRow
                - colSpan
                - rowSpan
                - createdAt
                - updatedAt
                additionalProperties: false
      description: Update a custom graph's name, definition, or filters
      tags:
      - Graphs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                graph:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                filters:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      summary: Patch api graphs by id
      x-summary-source: derived
    delete:
      operationId: deleteApiGraphsById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
                required:
                - id
                - deleted
                additionalProperties: false
      description: Delete a custom graph
      tags:
      - Graphs
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - analytics:manage
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
      summary: Delete api graphs by id
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
x-provenance:
  method: harvested
  publisher: LangWatch
  source: https://app.langwatch.ai/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
