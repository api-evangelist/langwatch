openapi: 3.2.0
info:
  title: LangWatch Files API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Files
paths:
  /api/v1/files/{projectId}/{storedObjectId}/{filename}:
    get:
      operationId: readNamedProjectStoredObjectBytes
      responses:
        '200':
          description: Success
          content:
            '*/*': {}
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions: []
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
        required: true
      - in: path
        name: storedObjectId
        schema:
          type: string
        required: true
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - Files
      summary: Read named project stored object bytes
      x-summary-source: derived
  /api/v1/files/{projectId}/{storedObjectId}:
    get:
      operationId: readProjectStoredObjectBytes
      responses:
        '200':
          description: Success
          content:
            '*/*': {}
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions: []
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
        required: true
      - in: path
        name: storedObjectId
        schema:
          type: string
        required: true
      - in: query
        name: filename
        schema:
          type: string
      tags:
      - Files
      summary: Read project stored object bytes
      x-summary-source: derived
  /api/v1/files/{storedObjectId}:
    get:
      operationId: readStoredObjectBytes
      responses:
        '200':
          description: Success
          content:
            '*/*': {}
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions: []
      parameters:
      - in: path
        name: storedObjectId
        schema:
          type: string
        required: true
      - in: query
        name: filename
        schema:
          type: string
      tags:
      - Files
      summary: Read stored object bytes
      x-summary-source: derived
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
