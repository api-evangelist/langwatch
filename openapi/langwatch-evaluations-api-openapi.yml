openapi: 3.2.0
info:
  title: LangWatch Evaluations API
  description: LangWatch openapi spec
  version: 1.0.0
servers:
- url: https://app.langwatch.ai
security:
- project_api_key: []
tags:
- name: Evaluations
paths:
  /api/v1/evaluations/list:
    get:
      operationId: getApiEvaluationsList
      responses:
        '200':
          description: The evaluator catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluators:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Display name of the evaluator
                        description:
                          type: string
                        category:
                          type: string
                        docsUrl:
                          type: string
                        isGuardrail:
                          type: boolean
                          description: Whether this evaluator can gate a request as a guardrail
                        requiredFields:
                          type: array
                          items:
                            type: string
                          description: '`data` keys the evaluate call must supply'
                        optionalFields:
                          type: array
                          items:
                            type: string
                        settings:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                          description: Each setting's default and description
                        settings_json_schema:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                          description: JSON Schema for this evaluator's settings object
                        envVars:
                          type: array
                          items:
                            type: string
                          description: Server-side variables the evaluator needs configured
                        result:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                          description: What its score, passed and label mean
                      required:
                      - name
                      - description
                      - category
                      - isGuardrail
                      - requiredFields
                      - optionalFields
                      - settings
                      - settings_json_schema
                      - envVars
                      - result
                    description: Keyed by evaluator id, the value you put in the evaluate path
                required:
                - evaluators
      description: List every evaluator this server ships with, along with the `data` fields each one needs and the settings it accepts. The keys of `evaluators` are the ids you put in the evaluate path. The list is the same for every caller and needs no credential.
      summary: List the built-in evaluators
      tags:
      - Evaluations
      security: []
      x-access-policy:
        kind: public
        credential:
        - none
  /api/v1/evaluations/{evaluator}/evaluate:
    post:
      operationId: postApiEvaluationsByEvaluatorEvaluate
      responses:
        '200':
          description: The evaluator ran, declined, or failed. Branch on `status`; in guardrail mode `passed` is set on all three.
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    status:
                      type: string
                      const: processed
                    score:
                      type: number
                    passed:
                      type: boolean
                    label:
                      type: string
                    details:
                      type: string
                    cost:
                      description: What running the evaluator cost
                      type: object
                      properties:
                        currency:
                          type: string
                        amount:
                          type: number
                      required:
                      - currency
                      - amount
                    raw_response:
                      description: The evaluator's own output, unprocessed
                  required:
                  - status
                - type: object
                  properties:
                    status:
                      type: string
                      const: skipped
                    details:
                      description: Why the evaluator declined to score this input
                      type: string
                    cost:
                      description: What the attempt cost, when the evaluator spent money before declining to score
                      type: object
                      properties:
                        currency:
                          type: string
                        amount:
                          type: number
                      required:
                      - currency
                      - amount
                    passed:
                      description: Always true in guardrail mode, so a skip does not block
                      type: boolean
                  required:
                  - status
                - type: object
                  properties:
                    status:
                      type: string
                      const: error
                    error_type:
                      type: string
                      const: EVALUATOR_ERROR
                      description: 'Constant: the evaluator''s own type is not exposed'
                    details:
                      type: string
                    passed:
                      description: Always true in guardrail mode, so a failure does not block
                      type: boolean
                  required:
                  - status
                  - error_type
                  - details
        '400':
          description: The body was not valid JSON, failed validation, or omitted a field this evaluator requires
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                - error
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                - error
        '403':
          description: The API key lacks evaluations:manage
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                - error
        '404':
          description: No evaluator answers to that id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The failure, as a sentence
                  kind:
                    description: Stable failure code, on the failures that carry one
                    type: string
                  meta:
                    description: What the code needs to be acted on, such as the missing field
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                - error
      description: Run one evaluator over a single input and get its score back. Built-in evaluators whose id has two segments, such as `ragas/faithfulness`, are addressed with the two-segment form of this path. Bodies up to 30MB are accepted.
      summary: Run an evaluator
      tags:
      - Evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trace_id:
                  description: Attaches the result to a trace you already sent
                  type:
                  - string
                  - 'null'
                evaluation_id:
                  description: Supply your own id to make the call idempotent
                  type:
                  - string
                  - 'null'
                evaluator_id:
                  type:
                  - string
                  - 'null'
                name:
                  description: Overrides the name the result is recorded under
                  type:
                  - string
                  - 'null'
                data:
                  type: object
                  properties: {}
                  additionalProperties: {}
                  description: What the evaluator scores. Which fields are required depends on the evaluator; its own entry under Built-in Evaluators lists them.
                settings:
                  anyOf:
                  - type: object
                    properties: {}
                    additionalProperties: {}
                  - type: 'null'
                  description: Per-call overrides of the evaluator's settings. Anything omitted falls back to the saved evaluator or monitor, then to the evaluator's own defaults.
                as_guardrail:
                  default: false
                  description: 'Evaluate as a guardrail: a skipped or failed evaluation answers `passed` rather than an error, so a caller can gate on one field. The /api/guardrails path sets this for you.'
                  type:
                  - boolean
                  - 'null'
              required:
              - data
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - evaluations:manage
      parameters:
      - in: path
        name: evaluator
        schema:
          type: string
        required: true
        description: Which evaluator to run. Either a built-in id (`ragas/faithfulness`), the slug of a monitor configured in this project, or `evaluators/{slug|id}` for a saved evaluator. `GET /api/evaluations/list` returns the built-in ids.
  /api/v1/evaluations/{evaluator}/{subpath}/evaluate:
