        name: id
        schema:
          type: string
          minLength: 1
        required: true
        description: The agent id.
      tags:
      - Agents
    delete:
      operationId: archiveAgent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                    enum:
                    - signature
                    - code
                    - workflow
                    - http
                    - connected
                    - voice
                  archivedAt:
                    anyOf:
                    - type: string
                      format: date-time
                    - type: 'null'
                required:
                - id
                - name
                - type
                - archivedAt
                additionalProperties: false
      summary: Archive an agent while keeping its runs
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - project:delete
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
        description: The agent id.
      tags:
      - Agents
  /api/v1/agents/{id}/call:
    post:
      operationId: callConnectedAgent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        role:
                          type: string
                          minLength: 1
                      required:
                      - role
                      additionalProperties: {}
                    - type: array
                      items:
                        type: object
                        properties:
                          role:
                            type: string
                            minLength: 1
                        required:
                        - role
                        additionalProperties: {}
                    description: 'What the function answered: text, one message, or a list of messages.'
                  session:
                    description: The agent's per-conversation memory, to send on the next turn.
                  instance:
                    type: object
                    properties:
                      hostname:
                        type: string
                      label:
                        type:
                        - string
                        - 'null'
                    required:
                    - hostname
                    - label
                    additionalProperties: false
                  durationMs:
                    type: number
                required:
                - output
                - instance
                - durationMs
                additionalProperties: false
      summary: Send one conversation turn to an online connected agent
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
        description: The agent id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        minLength: 1
                    required:
                    - role
                    additionalProperties: {}
                  description: The whole conversation so far, OpenAI style.
                newMessages:
                  description: The messages added since the agent's last turn. Defaults to the last message.
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        minLength: 1
                    required:
                    - role
                    additionalProperties: {}
                threadId:
                  description: The conversation id. Turns of one conversation share it; a new id starts a new one.
                  type: string
                  maxLength: 255
                params:
                  description: Run parameter values by name, as JSON scalars.
                  type: object
                  propertyNames:
                    type: string
                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                  additionalProperties:
                    type:
                    - string
                    - number
                    - boolean
                session:
                  description: The session the agent returned on its previous turn of this conversation, echoed back as is.
                traceparent:
                  description: The W3C trace context the agent adopts, so its spans join this turn's trace.
                  type: string
                  maxLength: 255
                run:
                  description: The simulation run this turn belongs to, if any.
                  type: object
                  properties:
                    scenarioRunId:
                      type: string
                    scenarioName:
                      type: string
                    batchRunId:
                      type: string
              required:
              - messages
      tags:
      - Agents
  /api/v1/agents/connect/register:
    post:
      operationId: registerConnectedAgentInstance
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  frame:
                    anyOf:
                    - type: object
                      properties:
                        protocol:
                          type: number
                          const: 1
                        type:
                          type: string
                          const: registered
                        agents:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              environment:
                                type: string
                              id:
                                type: string
                              url:
                                type: string
                              parameterNotes:
                                type: array
                                items:
                                  type: string
                              scope:
                                oneOf:
                                - type: object
                                  properties:
                                    kind:
                                      type: string
                                      const: shared
                                  required:
                                  - kind
                                  additionalProperties: false
                                - type: object
                                  properties:
                                    kind:
                                      type: string
                                      const: owner
                                  required:
                                  - kind
                                  additionalProperties: false
                                - type: object
                                  properties:
                                    kind:
                                      type: string
                                      const: host
                                    hostLabel:
                                      type: string
                                  required:
                                  - kind
                                  - hostLabel
                                  additionalProperties: false
                            required:
                            - name
                            - environment
                            - id
                            - url
                            - parameterNotes
                            - scope
                            additionalProperties: false
                        heartbeatIntervalMs:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        instanceId:
                          type: string
                      required:
                      - protocol
                      - type
                      - agents
                      - heartbeatIntervalMs
                      - instanceId
                      additionalProperties: false
                    - type: object
                      properties:
                        protocol:
                          type: number
                          const: 1
                        type:
                          type: string
                          const: refused
                        code:
                          type: string
                          enum:
                          - api_key_invalid
                          - project_required
                          - permission_denied
                          - key_type_not_allowed
                          - replica_count_unsupported
                          - parameters_invalid
                          - environment_invalid
                          - protocol_invalid
                        message:
                          type: string
                        meta:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                      required:
                      - protocol
                      - type
                      - code
                      - message
                      additionalProperties: false
                  instanceToken:
                    type: string
                required:
                - frame
                additionalProperties: false
      description: Returns a registered frame and instance token, or refuses at the status of the reason.
      summary: Register this process's agents
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                protocol:
                  type: number
                  const: 1
                type:
                  type: string
                  const: register
                sdk:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 64
                    version:
                      type: string
                      minLength: 1
                      maxLength: 64
                    language:
                      type: string
                      minLength: 1
                      maxLength: 32
                  required:
                  - name
                  - version
                  - language
                instance:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 128
                    hostname:
                      type: string
                      maxLength: 255
                    username:
                      type: string
                      maxLength: 255
                    pid:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    startedAt:
                      type: string
                      maxLength: 64
                    label:
                      type: string
                      maxLength: 128
                    inFlightCallIds:
                      default: []
                      maxItems: 1000
                      type: array
                      items:
                        type: string
                        maxLength: 128
                    maxConcurrency:
                      type: integer
                      exclusiveMinimum: 0
                      maximum: 1000
                  required:
                  - id
                  - hostname
                  - username
                  - pid
                  - startedAt
                agents:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      environment:
                        type: string
                        minLength: 1
                        maxLength: 64
                      parameters:
                        default: {}
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      concurrency:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 1000
                      timeoutMs:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      sticky:
                        type: boolean
                    required:
                    - name
                    - environment
              required:
              - protocol
              - type
              - sdk
              - instance
              - agents
      tags:
      - Agents
  /api/v1/agents/connect/poll:
    get:
      operationId: pollConnectedAgentInstance
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  frames:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          protocol:
                            type: number
                            const: 1
                          type:
                            type: string
                            const: call
                          callId:
                            type: string
                          agentId:
                            type: string
                          threadId:
                            type: string
                          messages:
                            type: array
                            items:
                              type: object
                              properties:
                                role:
                                  type: string
                                  minLength: 1
                              required:
                              - role
                              additionalProperties: {}
                          newMessages:
                            type: array
                            items:
                              type: object
                              properties:
                                role:
                                  type: string
                                  minLength: 1
                              required:
                              - role
                              additionalProperties: {}
                          params:
                            type: object
                            propertyNames:
                              type: string
                              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            additionalProperties:
                              type:
                              - string
                              - number
                              - boolean
                          session: {}
                          traceparent:
                            type:
                            - string
                            - 'null'
                          deadlineAt:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          run:
                            type: object
                            properties:
                              scenarioRunId:
                                type: string
                              scenarioName:
                                type: string
                              batchRunId:
                                type: string
                            additionalProperties: false
                        required:
                        - protocol
                        - type
                        - callId
                        - agentId
                        - threadId
                        - messages
                        - newMessages
                        - params
                        - traceparent
                        - deadlineAt
                        - run
                        additionalProperties: false
                      - type: object
                        properties:
                          protocol:
                            type: number
                            const: 1
                          type:
                            type: string
                            const: cancel
                          callId:
                            type: string
                            minLength: 1
                        required:
                        - protocol
                        - type
                        - callId
                        additionalProperties: false
                required:
                - frames
                additionalProperties: false
      summary: Wait for call and cancel frames while refreshing this instance's presence
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:manage
      parameters:
      - in: query
        name: inFlight
        schema:
          type: string
          maxLength: 200000
      tags:
      - Agents
  /api/v1/agents/connect/frames:
    post:
      operationId: postConnectedAgentFrames
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                - accepted
                additionalProperties: false
      summary: Accept this instance's acknowledgements, results and deregistration
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frames:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        protocol:
                          type: number
                          const: 1
                        type:
                          type: string
                          const: ack
                        callId:
                          type: string
                          minLength: 1
                      required:
                      - protocol
                      - type
                      - callId
                    - type: object
                      properties:
                        protocol:
                          type: number
                          const: 1
                        type:
                          type: string
                          const: result
                        callId:
                          type: string
                          minLength: 1
                        output:
                          anyOf:
                          - type: string
                          - type: object
                            properties:
                              role:
                                type: string
                                minLength: 1
                            required:
                            - role
                            additionalProperties: {}
                          - type: array
                            items:
                              type: object
                              properties:
                                role:
                                  type: string
                                  minLength: 1
                              required:
                              - role
                              additionalProperties: {}
                        session: {}
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                              minLength: 1
                              maxLength: 64
                            message:
                              type: string
                              maxLength: 4000
                          required:
                          - code
                          - message
                      required:
                      - protocol
                      - type
                      - callId
                    - type: object
                      properties:
                        protocol:
                          type: number
                          const: 1
                        type:
                          type: string
                          const: deregister
                      required:
                      - protocol
                      - type
              required:
              - frames
      tags:
      - Agents
  /api/v1/agents/{id}/test:
    post:
      operationId: testAgent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioRunId:
                    type: string
                    description: The run to follow; open it in the simulations run drawer.
                  batchRunId:
                    type: string
                    description: The batch the run belongs to.
                  setId:
                    type: string
                    description: The internal set that holds agent test runs.
                required:
                - scenarioRunId
                - batchRunId
                - setId
                additionalProperties: false
      summary: Schedule a scripted test run and return its run identifiers
      security:
      - project_api_key: []
      x-access-policy:
        kind: handlerManaged
        credential:
        - project_api_key
        permissions:
        - scenarios:create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          minLength: 1
        required: true
        description: The agent id.
      tags:
      - Agents
components:
  securitySchemes:
    project_api_key:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: 'Project API key for sending traces and accessing project-scoped resources. Format: sk-lw-... (no underscore). Obtain one by creating a project via the Admin API or the LangWatch UI.'
    admin_api_key:
      type: http
      scheme: bearer
      description: 'Admin API key for organization-level operations (managing projects, API keys). Create one in Settings > API Keys or via POST /api/api-keys. Format: sk-lw-{id}_{secret}.'
    scim_bearer:
      type: http
      scheme: bearer
      description: SCIM token for one organization's directory connection, created with POST /api/scim-tokens or in Settings > SCIM. It authenticates provisioning calls only, and stops working if the organization's Enterprise plan lapses.
    cli_access_token:
      type: http
      scheme: bearer
      description: The device session the LangWatch CLI holds after `langwatch login`. It acts as the person who signed in, in the organization they chose, and expires unless the CLI refreshes it.
    instance_admin_key:
      type: http
      scheme: bearer
      description: Instance administrator key, set as LANGWATCH_INSTANCE_ADMIN_API_KEY on a self-hosted deployment. It exists to create the first organization, before any organization key does; every other management API takes an organization key instead.
    internal_secret:
      type: http
      scheme: bearer
      description: The deployment's own shared secret, presented by another LangWatch service rather than by a customer. The families behind it are ingress-blocked; they are described so a self-hosted operator can see what the deployment talks to itself about.
